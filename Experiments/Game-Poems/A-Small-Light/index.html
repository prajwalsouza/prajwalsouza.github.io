<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>A Small Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
/* A game poem. One canvas, one diorama strip, no interface beyond a hand. */
:root{
  --ink:#16121f;          /* night ground behind everything */
  --paper:rgba(255,250,240,.86);
  --glass:rgba(22,16,34,.2);
  --glass-hi:rgba(22,16,34,.38);
  --rim:rgba(255,255,255,.22);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --voice:"Gaegu","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.btn{position:fixed;width:38px;height:38px;border-radius:50%;border:1px solid var(--rim);background:var(--glass);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--paper);display:grid;place-items:center;cursor:pointer;
  transition:opacity 1.2s ease,background .3s;padding:0}
.btn:hover{background:var(--glass-hi)}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#mute{top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));opacity:.75}
#again{left:50%;bottom:calc(11% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);opacity:0;pointer-events:none;width:48px;height:48px}
#again.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c" aria-label="A small creature on a floating island. Tap to help it."></canvas>
<button id="mute" class="btn" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path id="wv" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path id="mx" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
<button id="again" class="btn" aria-label="Begin again"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M5 4.5v3.6h3.6"/></svg></button>
<script>
(()=>{
'use strict';
/* ================= utilities ================= */
const TAU=Math.PI*2, FOOT=5;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const sm01=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const n1=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const mulc=(a,b)=>[a[0]*b[0]/255,a[1]*b[1]/255,a[2]*b[2]/255];
const F=p=>typeof p==='function'?p:()=>p;
const Q=new URLSearchParams(location.search);
const SPEED=+Q.get('speed')||1;
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= canvas ================= */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const dk=document.createElement('canvas'), dctx=dk.getContext('2d');
let W=1,H=1,DPR=1,Z=1,zoomMul=1,vx0=0,vx1=0,NIGHT=0;
let fg=null, vign=null, grainPat=null;
const cam={x:0,y:0};
let shake=0;
function baseZoom(){return Math.min(H/540,W/600)}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);dk.width=cv.width;dk.height=cv.height;
  buildVignette();
}
function buildFG(){
  fg=document.createElement('canvas');const w=1600,h=200;fg.width=w;fg.height=h;const g=fg.getContext('2d');
  if('filter' in g) g.filter='blur(5px)';
  const r=rng(77);
  const clumps=[120,430,610,980,1240,1450];
  for(const cx of clumps){
    const n=18+Math.floor(r()*16);
    for(let i=0;i<n;i++){
      const x=cx+(r()-.5)*150, bh=50+r()*140*(r()<.35?1:.55), lean=(r()-.5)*60;
      g.fillStyle=r()<.5?'rgb(24,36,32)':'rgb(34,48,40)';
      g.beginPath();g.moveTo(x-6,h);g.quadraticCurveTo(x+lean*.25,h-bh*.6,x+lean,h-bh);g.quadraticCurveTo(x+lean*.25+3,h-bh*.6,x+6,h);g.fill();
    }
  }
}
function buildVignette(){
  vign=document.createElement('canvas');vign.width=Math.max(1,Math.round(W/2));vign.height=Math.max(1,Math.round(H/2));
  const g=vign.getContext('2d'),w=vign.width,h=vign.height;
  const rg=g.createRadialGradient(w/2,h*.48,Math.min(w,h)*.3,w/2,h/2,Math.hypot(w,h)*.62);
  rg.addColorStop(0,'rgba(20,10,30,0)');rg.addColorStop(1,'rgba(20,10,34,.5)');g.fillStyle=rg;g.fillRect(0,0,w,h);
}
function buildGrain(){
  const c=document.createElement('canvas');c.width=c.height=140;const g=c.getContext('2d');const d=g.createImageData(140,140);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  g.putImageData(d,0,0);grainPat=ctx.createPattern(c,'repeat');
}

/* ================= palette ================= */
const PALS=[
 {t:0,  skyTop:[60,54,112],skyMid:[192,134,166],skyBot:[255,200,168],sun:[255,214,170],amb:[255,228,218],haze:[236,192,186],far:[180,148,178],mid:[148,126,158],near:[118,108,134],stars:.12},
 {t:.22,skyTop:[92,156,216],skyMid:[158,206,232],skyBot:[228,240,234],sun:[255,250,232],amb:[255,255,252],haze:[210,230,236],far:[172,202,216],mid:[136,180,180],near:[106,152,134],stars:0},
 {t:.45,skyTop:[98,110,174],skyMid:[228,170,158],skyBot:[255,216,158],sun:[255,206,130],amb:[255,236,208],haze:[246,206,170],far:[206,158,158],mid:[168,130,140],near:[126,112,112],stars:0},
 {t:.6, skyTop:[38,38,88],skyMid:[136,90,142],skyBot:[238,148,128],sun:[255,158,114],amb:[210,180,208],haze:[164,126,158],far:[122,94,134],mid:[94,74,114],near:[72,62,94],stars:.4},
 {t:.78,skyTop:[9,12,34],skyMid:[22,30,70],skyBot:[48,56,104],sun:[226,232,255],amb:[92,104,170],haze:[44,54,98],far:[42,48,88],mid:[32,36,70],near:[24,28,56],stars:1},
];
PALS.push(Object.assign({},PALS[0],{t:1}));
function pal(t){
  t=((t%1)+1)%1;
  for(let i=0;i<PALS.length-1;i++){const a=PALS[i],b=PALS[i+1];
    if(t<=b.t){const k=sm01((t-a.t)/(b.t-a.t));const o={};for(const key in a){if(key==='t')continue;o[key]=Array.isArray(a[key])?mixc(a[key],b[key],k):lerp(a[key],b[key],k)}return o}}
  return PALS[0];
}
const BASE={grass:[122,184,92],grassLt:[180,220,120],grassDk:[84,140,74],moss:[80,112,90],tuft:[100,164,82],tuft2:[146,200,100],
 soil:[170,118,84],soil2:[138,94,70],soil3:[106,72,64],soil4:[72,54,62],sand:[200,172,134],rock:[132,118,136],rockDk:[86,78,100],
 caveBack:[60,52,76],stone:[188,182,194],stoneDk:[132,126,148],trunk:[130,92,66],trunkDk:[96,66,52],leaf:[102,170,100],leafDk:[70,130,88],
 leafLt:[160,210,126],pine:[72,128,108],water:[112,192,216],waterDk:[56,112,166],stem:[246,234,216],cap:[220,120,110]};
const M={},MC={};
const FLOWERS=[[255,212,226],[255,246,206],[214,198,255],[255,182,150]];
function materials(P){
  for(const k in BASE){const c=mixc(mulc(BASE[k],P.amb),P.haze,.05);MC[k]=c;M[k]=rgb(c)}
  const bl=mixc(P.amb,[255,255,255],.55);
  M.bodyHi=rgb(mulc([255,254,248],bl));M.bodyMid=rgb(mulc([255,240,224],bl));M.bodyEdge=rgb(mulc([236,196,172],bl));
  M.feet=rgb(mulc([228,184,160],bl));M.eye=rgb(mulc([46,34,52],bl));
  MC.flowers=FLOWERS.map(f=>rgb(mulc(f,mixc(P.amb,[255,255,255],.2))));
  MC.backHaze=P.haze;
}

/* ================= audio ================= */
const AU={ctx:null,on:true,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=this.ctx=new AC();
    this.out=c.createGain();this.out.gain.setValueAtTime(0,c.currentTime);this.out.gain.linearRampToValueAtTime(this.on?.9:0,c.currentTime+2.5);
    const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.25;
    this.out.connect(comp);comp.connect(c.destination);
    this.rev=c.createConvolver();this.rev.buffer=this.impulse(4,2.4);const rg=c.createGain();rg.gain.value=.6;this.rev.connect(rg);rg.connect(this.out);
    this.mus=c.createGain();this.mus.gain.value=.8;this.mus.connect(this.out);const ms=c.createGain();ms.gain.value=.6;this.mus.connect(ms);ms.connect(this.rev);
    this.fx=c.createGain();this.fx.gain.value=.85;this.fx.connect(this.out);const fs=c.createGain();fs.gain.value=.3;this.fx.connect(fs);fs.connect(this.rev);
    this.noise=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=this.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const w=c.createBufferSource();w.buffer=this.noise;w.loop=true;const wf=c.createBiquadFilter();wf.type='bandpass';wf.frequency.value=420;wf.Q.value=.7;
    const wg=c.createGain();wg.gain.value=0;w.connect(wf);wf.connect(wg);wg.connect(this.out);w.start();
    const lfo=c.createOscillator();lfo.frequency.value=.06;const lg=c.createGain();lg.gain.value=220;lfo.connect(lg);lg.connect(wf.frequency);lfo.start();
    this.windG=wg;
    const ws=c.createBufferSource();ws.buffer=this.noise;ws.loop=true;const wl=c.createBiquadFilter();wl.type='lowpass';wl.frequency.value=900;
    const wh=c.createBiquadFilter();wh.type='highpass';wh.frequency.value=220;const wtg=c.createGain();wtg.gain.value=0;
    ws.connect(wl);wl.connect(wh);wh.connect(wtg);wtg.connect(this.out);ws.start();this.waterG=wtg;
    Music.next=c.currentTime+.1;
  },
  impulse(sec,decay){const c=this.ctx,n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b},
  get t(){return this.ctx.currentTime},
  setMute(m){this.on=!m;if(this.ctx)this.out.gain.setTargetAtTime(m?0:.9,this.ctx.currentTime,.2)}
};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function genv(t,a,v,d,dest){const g=AU.ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);g.connect(dest||AU.fx);return g}
function osc(type,f,t,stop,dest){const o=AU.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(stop);return o}
function noise(t,d,dest){const s=AU.ctx.createBufferSource();s.buffer=AU.noise;s.connect(dest);s.start(t,Math.random()*1.4,d+.05);return s}
function bell(m,t,vol=.08,dur=2.2,dest){const f=mtof(m);dest=dest||AU.mus;
  osc('sine',f,t,t+dur+.1,genv(t,.004,vol,dur,dest));
  osc('sine',f*2,t,t+dur*.4,genv(t,.002,vol*.28,dur*.35,dest));
  osc('sine',f*3.99,t,t+dur*.2,genv(t,.001,vol*.1,dur*.12,dest));}
function pad(notes,t,dur,vol,cut){const c=AU.ctx;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;f.Q.value=.4;
  const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+2.4);g.gain.setValueAtTime(vol,t+dur-2.6);g.gain.linearRampToValueAtTime(.0001,t+dur);
  f.connect(g);g.connect(AU.mus);
  for(const m of notes)for(const d of [-7,7]){const o=c.createOscillator();o.type='triangle';o.frequency.value=mtof(m);o.detune.value=d;o.connect(f);o.start(t);o.stop(t+dur+.1)}}
function pluck(m,t,vol){const c=AU.ctx;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(240,t+.6);
  const g=genv(t,.005,vol,1.3,AU.mus);f.connect(g);osc('triangle',mtof(m),t,t+1.4,f)}
const sfx={
  ok(){return AU.ctx&&AU.on},
  chirp(c,ch){if(!this.ok())return;const t=AU.t;const base=c.kid?980:560*Math.sqrt(.85/c.scale);
    let f0=base*(.9+Math.random()*.38);if('aeiou'.includes(ch))f0*=1.08;if(ch==='?')f0*=1.2;
    const o=AU.ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*(ch==='?'?1.7:1.25+Math.random()*.25),t+.045);o.frequency.exponentialRampToValueAtTime(f0*.94,t+.09);
    const g=genv(t,.008,c.kid?.05:.065,.09);o.connect(g);o.start(t);o.stop(t+.13);
    osc('triangle',f0*2.01,t,t+.1,genv(t,.006,.012,.07))},
  giggle(c){if(!this.ok())return;const t=AU.t;const b=c.kid?1000:620;for(let i=0;i<3;i++){const f=b*(1+i*.18);const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(f,t+i*.075);o.frequency.exponentialRampToValueAtTime(f*1.35,t+i*.075+.05);o.connect(genv(t+i*.075,.006,.055,.07));o.start(t+i*.075);o.stop(t+i*.075+.1)}},
  wake(){if(!this.ok())return;const t=AU.t;const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(300,t+.35);o.frequency.exponentialRampToValueAtTime(560,t+.7);o.connect(genv(t,.05,.05,.7));o.start(t);o.stop(t+.8)},
  hop(c){if(!this.ok())return;const t=AU.t;const f=(c.kid?760:430)*(.95+Math.random()*.1);const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.7,t+.08);o.connect(genv(t,.004,c.kid?.025:.035,.09));o.start(t);o.stop(t+.14)},
  land(c){if(!this.ok())return;const t=AU.t;const lp=AU.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.connect(genv(t,.003,c.kid?.05:.09,.08));noise(t,.1,lp);
    const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(c.kid?220:150,t);o.frequency.exponentialRampToValueAtTime(60,t+.1);o.connect(genv(t,.003,c.kid?.03:.06,.1));o.start(t);o.stop(t+.14)},
  boing(){if(!this.ok())return;const t=AU.t,c=AU.ctx;const o=c.createOscillator();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(620,t+.16);o.frequency.exponentialRampToValueAtTime(430,t+.34);
    const l=c.createOscillator();l.frequency.value=26;const lg=c.createGain();lg.gain.value=34;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+.45);
    o.connect(genv(t,.005,.13,.4));o.start(t);o.stop(t+.46)},
  grow(){if(!this.ok())return;const t=AU.t;const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(880,t+.22);o.connect(genv(t,.01,.05,.2));o.start(t);o.stop(t+.26);bell(86,t+.15,.04,1.2,AU.fx)},
  pop(){if(!this.ok())return;const t=AU.t;const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(260,t+.08);o.connect(genv(t,.003,.08,.08));o.start(t);o.stop(t+.12)},
  stone(){if(!this.ok())return;const t=AU.t;const lp=AU.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;lp.connect(genv(t,.01,.28,.35));noise(t,.4,lp);
    const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(74,t);o.frequency.exponentialRampToValueAtTime(38,t+.3);o.connect(genv(t,.005,.16,.3));o.start(t);o.stop(t+.36);bell(69,t+.05,.03,1.4,AU.fx)},
  creak(){if(!this.ok())return;const t=AU.t,c=AU.ctx;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=620;bp.Q.value=7;bp.connect(genv(t,.2,.07,.9));
    const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(72,t);o.frequency.linearRampToValueAtTime(96,t+1);const l=c.createOscillator();l.frequency.value=6;const lg=c.createGain();lg.gain.value=10;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+1.2);o.connect(bp);o.start(t);o.stop(t+1.2)},
  thud(){if(!this.ok())return;const t=AU.t;const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(72,t);o.frequency.exponentialRampToValueAtTime(32,t+.5);o.connect(genv(t,.005,.34,.5));o.start(t);o.stop(t+.56);
    const lp=AU.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.connect(genv(t,.005,.22,.45));noise(t,.5,lp)},
  splash(){if(!this.ok())return;const t=AU.t;const bp=AU.ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;bp.frequency.setValueAtTime(1800,t);bp.frequency.exponentialRampToValueAtTime(420,t+.7);bp.connect(genv(t,.01,.26,.7));noise(t,.8,bp)},
  tapAmb(sx){if(!this.ok())return;const sc=Music.SC;const i=clamp(Math.floor(sx/W*sc.length),0,sc.length-1);bell(sc[i],AU.t,.035,1.6,AU.fx)},
  tapGood(){if(!this.ok())return;const t=AU.t;bell(86,t,.05,1.6,AU.fx);bell(93,t+.08,.04,1.8,AU.fx)},
  flare(){if(!this.ok())return;const t=AU.t;[90,93,98].forEach((m,i)=>bell(m,t+i*.06,.025,1.4,AU.fx))},
  gain(){if(!this.ok())return;const t=AU.t;const ch=Music.CH[Math.floor(Music.step/16)%4];const ns=[ch[2]+12,ch[3]+12,ch[4]+12,ch[2]+24,ch[3]+24,ch[4]+24];ns.forEach((m,i)=>bell(m,t+i*.075,.05,2,AU.fx))},
  swell(){if(!this.ok())return;const t=AU.t;[62,66,69,74,78,81,86,90].forEach((m,i)=>bell(m+12,t+i*.11,.04,2.6,AU.mus))},
  tick(){if(!this.ok())return;bell(98,AU.t,.015,.4,AU.fx)},
  bloom(i){if(!this.ok())return;const sc=Music.SC;bell(sc[i%sc.length],AU.t,.06,2.2,AU.fx)},
  lob(){if(!this.ok())return;const t=AU.t;const o=AU.ctx.createOscillator();o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(980,t+.18);o.connect(genv(t,.01,.025,.18));o.start(t);o.stop(t+.22)},
  hatch(){if(!this.ok())return;this.pop();const t=AU.t;[81,86,90].forEach((m,i)=>bell(m,t+.05+i*.05,.04,1.6,AU.fx))},
};
const Music={step:0,next:0,SD:.42,mel:3,awake:false,night:false,kids:false,ending:false,
  CH:[[50,57,62,66,69],[47,54,62,66,69],[43,50,59,62,66],[45,52,61,64,69]],
  SC:[74,76,78,81,83,86,88,90,93],
  PAT:[1,0,.35,0,.7,0,.3,.15,.9,0,.4,0,.6,.1,.35,.2],
  update(){const c=AU.ctx;if(!c)return;if(this.next<c.currentTime)this.next=c.currentTime+.05;
    while(this.next<c.currentTime+.3){this.sched(this.step,this.next);this.next+=this.SD;this.step++}},
  sched(s,t){
    if(this.ending)return;
    const bar=s%16,ch=this.CH[Math.floor(s/16)%4];const L=hero?hero.lights.length:0;

function blocked(x){
  for(const o of obs){
    if(o.type==='gap'&&x>o.x0-90&&x<o.x1+90)return true;
    if(o.type==='wall'&&x>o.x-240&&x<o.x+70)return true;
    if(o.type==='river'&&x>o.x0-140&&x<o.x1+90)return true;
    if(o.type==='dark'&&x>o.x0-220&&x<o.x1+220)return true;
  }
  if(x>NEST.x-60&&x<NEST.x+320)return true;
  return false;
}
for(const s of segs){
  s.openL=!segs.some(o=>o!==s&&(Math.abs(o.x1-s.x0)<8||(o.x0<s.x0-2&&o.x1>s.x0+2)));s.openR=!segs.some(o=>o!==s&&(Math.abs(o.x0-s.x1)<8||(o.x0<s.x1-2&&o.x1>s.x1+2)));
  const r=rng(Math.floor(s.x0*7+13));s.seed=r()*100;s.depth=170+r()*70;s.under=Math.min(290,(s.x1-s.x0)*.32+30);
  s.tufts=[];s.flowers=[];s.trees=[];s.pebbles=[];s.roots=[];
  const w=s.x1-s.x0;
  for(let i=0;i<w/14;i++)s.pebbles.push({x:s.x0+r()*w,y:s.y+24+r()*s.depth*.55,rx:2+r()*5,ry:1.5+r()*3,k:r()});
  if(s.bed)continue;
  for(let x=s.x0+4;x<s.x1-3;x+=5+r()*9)s.tufts.push({x,h:5+r()*9,l:(r()-.5)*.9,front:r()<.5,k:r()});
  if(!s.cave)for(let x=s.x0+20;x<s.x1-20;x+=18+r()*50)if(r()<.38&&!(x>NEST.x-20&&x<NEST.x+260))s.flowers.push({x,h:7+r()*10,c:Math.floor(r()*4),front:r()<.6,ph:r()*6});
  if(!s.cave)for(let x=s.x0+40;x<s.x1-40;x+=80+r()*160){if(!blocked(x)&&r()<.75)s.trees.push({x,s:.7+r()*.8,type:r()<.3?'pine':r()<.45?'bush':'round',k:r()})}
  for(const ex of [s.openL?s.x0:null,s.openR?s.x1:null])if(ex!==null)for(let i=0;i<3;i++)s.roots.push({x:ex+(ex===s.x0?1:-1)*(4+r()*26),len:14+r()*34,ph:r()*6});
}

function groundY(x,ignoreLogs){
  let g=null;
  for(const s of segs){if(s.bed)continue;if(x>=s.x0-.5&&x<=s.x1+.5)g=g===null?s.y:Math.min(g,s.y)}
  if(g!==null)g-=FOOT;
  if(!ignoreLogs)for(const t of trees)if(t.state==='down'&&x>=t.x+6&&x<=t.x+t.L-4){const ly=t.y-FOOT-6;g=g===null?ly:Math.min(g,ly)}
  return g;
}

const parts=[];

function dust(x,y,n,s=1){for(let i=0;i<n;i++)P({x:x+(Math.random()-.5)*14*s,y:y+2,vx:(Math.random()-.5)*90*s,vy:-Math.random()*40*s,g:50,drag:3,life:.5+Math.random()*.5,size:3+Math.random()*4*s,grow:6,col:mixc(MC.soil,[255,240,220],.5),type:'puff'})}
function sparks(x,y,col,n,sp=1){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(30+Math.random()*120)*sp;P({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,g:40,drag:2.2,life:.6+Math.random()*.7,size:1.6+Math.random()*2.4,col,type:'spark',glow:true})}}
function heart(c){const h=c.head();P({x:h.x+c.r*.6,y:h.y+c.r*.3,vx:10,vy:-28,drag:.6,life:1.8,size:c.r*.32,col:[255,140,170],type:'heart'})}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
  const d=Math.exp(-p.drag*dt);p.vx*=d;p.vy*=d;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.size+=p.grow*dt;
  if(p.type==='firefly'||p.type==='mote'){p.vx+=Math.sin(time*1.7+p.ph)*14*dt;p.vy+=Math.cos(time*1.3+p.ph)*10*dt}}}
function drawHeart(x,y,s){const c=ctx;c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s*1.1,y-s*.35,x-s*.45,y-s*1.05,x,y-s*.45);c.bezierCurveTo(x+s*.45,y-s*1.05,x+s*1.1,y-s*.35,x,y+s*.35);c.fill()}
function drawParts(glow){const c=ctx;
  for(const p of parts){if(p.glow!==glow)continue;const k=p.life/p.max;
    switch(p.type){
      case 'puff':c.fillStyle=rgb(p.col,.45*k);c.beginPath();c.arc(p.x,p.y,p.size,0,TAU);c.fill();break;
      case 'leaf':c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=rgb(p.col,Math.min(1,k*3));c.beginPath();c.ellipse(0,0,p.size,p.size*.45,0,0,TAU);c.fill();c.restore();break;

      case 'heart':c.fillStyle=rgb(p.col,Math.min(1,k*2));drawHeart(p.x,p.y,p.size*(.5+.5*Math.min(1,(1-k)*6)));break;
      case 'z':c.fillStyle=`rgba(255,252,244,${Math.min(1,k*1.5)*.85})`;c.font=`700 ${p.size}px Gaegu, sans-serif`;c.fillText('z',p.x,p.y);break;
      case 'spark':c.fillStyle=rgb(p.col,k*.3);c.beginPath();c.arc(p.x,p.y,p.size*3*k+1,0,TAU);c.fill();c.fillStyle=rgb(mixc(p.col,[255,255,255],.6),k);c.beginPath();c.arc(p.x,p.y,p.size*k+.4,0,TAU);c.fill();break;
      case 'firefly':case 'mote':{const a=Math.min(1,k*3,(1-k)*4)*(.55+.45*Math.sin(time*4+p.ph));c.fillStyle=rgb(p.col,a*.22);c.beginPath();c.arc(p.x,p.y,p.size*4,0,TAU);c.fill();c.fillStyle=rgb(mixc(p.col,[255,255,255],.5),a);c.beginPath();c.arc(p.x,p.y,p.size,0,TAU);c.fill();break}
    }}}

const creatures=[];
class Creature{
  constructor(x,y,scale,kid=false){
    Object.assign(this,{x,y,scale,ts:scale,kid,facing:1,state:'idle',tx:x,speed:kid?68:60,lights:[],sq:0,sqv:0,blinkT:1+Math.random()*3,blinkP:0,
      lookMode:'facing',look:{x:0,y:0},lookTemp:null,ex:0,ey:0,spA:0,spV:0,walkPh:0,bubble:null,arc:null,happy:0,eyesClosed:false,sleeping:false,
      sit:0,sitT:0,lean:0,pushing:false,talk:0,flash:0,flashCol:[255,240,210],vx:0,vy:0,ox:0,oy:0,flower:0,flowerT:0,zT:1,seed:Math.random()*100,_res:{},_resume:false})}
  get r(){return 22*this.scale}
  chest(){return{x:this.x,y:this.y-this.r*(1.02-this.sit*.28)}}

  wake(){this.sleeping=false;this.eyesClosed=false;this.sitT=0;this.sqv+=9;this.spV+=8;sfx.wake();sparks(this.x,this.y-this.r,[255,240,210],10)}
  poke(){this.happy=1.3;this.sqv+=9;this.spV+=(Math.random()-.5)*14;sfx.giggle(this);heart(this)}
  addLight(col){this.lights.push({col});this.flash=1.2;this.flashCol=col;this.sqv+=7;this.happy=1.3;this.ts+=this.kid?.03:.06;const p=this.chest();sparks(p.x,p.y,col,24,1.2);sfx.gain()}
  flareAll(){this.flash=1.4;this.flashCol=this.mixCol();const p=this.chest();for(const l of this.lights)sparks(p.x,p.y,l.col,12,1.4);this.sqv+=6;sfx.flare()}
  mixCol(){if(!this.lights.length)return[255,236,210];let r=0,g=0,b=0;for(const l of this.lights){r+=l.col[0];g+=l.col[1];b+=l.col[2]}const n=this.lights.length;return[r/n,g/n,b/n]}

function groupLead(){const all=[...kids,hero];let x=0,y=0;for(const c of all){x+=c.x;y+=c.y}return{x:x/all.length,y:y/all.length,facing:1}}
async function gainLight(c,col,from){await fly(from,()=>c.chest(),col,1.0,70);c.addLight(col)}
async function conjure(c,col,target){c.flash=1;c.flashCol=col;c.sqv+=5;sfx.flare();await wait(.25);await fly(()=>c.chest(),target,col,.7,60)}
function lob(c,tx,col){const p=c.chest();tx+=(Math.random()-.5)*70;const g=groundY(tx,true)??p.y;const T=.5+Math.random()*.5;const vx=(tx-p.x)/T;const vy=((g-p.y)-.5*900*T*T)/T;
  seeds.push(new Seed(p.x,p.y,col,vx,vy));sfx.lob();c.sqv+=5;c.flash=.7;c.flashCol=col}
function plantSeed(x,y){const g=groundY(x,true);if(g===null)return;const o=caveMode.o;const ceil=o.y-175;
  seeds.push(new Seed(x,clamp(y,ceil+14,g-8),LIGHT.rose));caveMode.last=time;caveMode.count++;sfx.tick()}
function walkGroup(x,gk=34){return Promise.all([...kids.map((k,i)=>k.walkTo(x-i*gk)),hero.walkTo(x-kids.length*gk-48)])}
async function passLight(col){hero.flash=1.2;hero.flashCol=col;hero.sqv+=6;sfx.flare();await wait(.35);
  await Promise.all(kids.map((k,i)=>wait(i*.3).then(()=>fly(()=>hero.chest(),()=>k.chest(),col,1.05,60)).then(()=>k.addLight(col))))}

async function helpDark(c,o){

  let hint=new Hint(hp,{visual:true});hints.push(hint);let hc=0;
  while(c.x<o.x1+40){
    const r=reach(o,c);c.goto(Math.max(c.x,Math.min(r-34,o.x1+90)));
    if(c.state==='walk')c.lookMode='facing';
    if(hint&&caveMode.count>hc){hint.dead=true;hint=null}
    if(!hint&&c.state==='idle'&&time-caveMode.last>6&&r<o.x1){hint=new Hint(hp,{visual:true});hints.push(hint);hc=caveMode.count;caveMode.last=time}

  const ls=seeds.filter(s=>s.x<o.x1+60).sort((a,b)=>b.x-a.x)[0];
  await c.walkTo(o.x1+90);
  await gainLight(c,LIGHT.rose,ls?()=>ls.top:{x:o.x1,y:o.y-30});

function jump(from){

  for(const c of [LIGHT.amber,LIGHT.mint,LIGHT.sky,LIGHT.rose])hero.lights.push({col:c});
  const put=x=>{hero.x=hero.tx=x;hero.y=groundY(x);cam.x=x;cam.y=hero.y-80};
  const fell=o=>{o.tree.ang=Math.PI/2;o.tree.state='down';o.tree.hit=true};
  for(const o of obs)if(o.tag==='A'&&o.type==='river')fell(o);
  if(from==='B'){hero.ts=hero.scale=1.14;put(A[3].x1+340);setTod(.3,.1);return 'B'}
  for(const o of obs)if(o.tag==='B'&&o.type==='river')fell(o);
  hero.ts=hero.scale=1.3;hero.flowerT=hero.flower=1;
  if(from==='night'){put(NEST.x0+40);setTod(.5,.1);return 'night'}
  put(NEST.x);setTod(1.06,.1);Music.kids=true;
  [56,92,128].forEach((d,i)=>{const b=new Bud(NEST.x+d,groundY(NEST.x+d)+3);b.T=b.o=1;buds.push(b);const k=new Creature(NEST.x+d-6,groundY(NEST.x+d-6),.42,true);k.tx=k.x;creatures.push(k);kids[i]=k});
  if(from==='end'){for(const o of obsBy('D'))if(o.type==='river')fell(o);
    for(const k of kids)for(const c of [LIGHT.amber,LIGHT.mint,LIGHT.sky,LIGHT.rose])k.lights.push({col:c});
    const x=ENDSEG.x0+100;put(x);kids.forEach((k,i)=>{k.x=k.tx=x+60+i*34;k.y=groundY(k.x)});setTod(1.4,.1);return 'end'}
  return 'kids'}

  for(let i=hints.length-1;i>=0;i--){const h=hints[i];if(h.dead||h.visual)continue;const q=h.pos();

  x.shadowColor='transparent';const tx=clamp(s.x,bx+14,bx+w-14);x.beginPath();x.moveTo(tx-7,by+h-1);x.lineTo(tx,by+h+8);x.lineTo(tx+7,by+h-1);x.fill();
  x.fillStyle='#4b3a52';x.textBaseline='middle';x.textAlign='left';x.fillText(txt,bx+13,by+h/2+1);x.restore();
}
function render(){
  const P=pal(tod);materials(P);NIGHT=P.stars;const c=ctx;
  c.setTransform(DPR,0,0,DPR,0,0);c.globalCompositeOperation='source-over';
  drawSky(P);
  const shx=(Math.random()-.5)*shake,shy=(Math.random()-.5)*shake;
  const WT=()=>c.setTransform(DPR*Z,0,0,DPR*Z,DPR*(W/2-(cam.x+shx)*Z),DPR*(H/2-(cam.y+shy)*Z));
  WT();vx0=cam.x-W/2/Z-60;vx1=cam.x+W/2/Z+60;
  for(const s of segs)if(!s.bed&&vis(s.x0-80,s.x1+80))for(const t of s.trees)if(t.x>vx0-60&&t.x<vx1+60)drawBackTree(t,s.y);
  drawNestTree();
  for(const s of segs)if(s.bed&&vis(s.x0,s.x1))drawSeg(s);
  for(const s of segs)if(!s.bed&&vis(s.x0-10,s.x1+10))drawSeg(s);
  for(const s of segs)if(!s.bed&&vis(s.x0,s.x1))drawTufts(s,false);
  for(const o of obs)if(o.type==='river'&&vis(o.x0,o.x1))o.water.draw();
  for(const o of caves)drawCave(o);
  for(const t of trees)if(vis(t.x-90,t.x+t.L+90))t.draw();
  for(const b of buds)b.draw();for(const t of things)t.draw();for(const s of seeds)s.draw();
  const cs=creatures.slice().sort((a,b)=>b.scale-a.scale);for(const k of cs)k.draw();
  for(const s of segs)if(!s.bed&&vis(s.x0,s.x1)){drawTufts(s,true);drawFlowers(s)}
  drawParts(false);
  drawDarkness();
  WT();c.globalCompositeOperation='lighter';
  nestGlow();for(const b of buds)b.drawGlow();for(const t of things)t.drawGlow();for(const s of seeds)s.drawGlow();
  for(const k of creatures)k.drawGlow();for(const f of flyers)f.drawGlow();drawParts(true);for(const h of hints)h.drawGlow();
  c.globalCompositeOperation='source-over';
  c.setTransform(DPR,0,0,DPR,0,0);
  const mg=c.createLinearGradient(0,H*.72,0,H);mg.addColorStop(0,rgb(P.haze,0));mg.addColorStop(1,rgb(P.haze,.4));c.fillStyle=mg;c.fillRect(0,H*.72,W,H*.28);
  if(fg){const fh=Math.min(H*.2,170),sc=fh/200,fw=1600*sc;let ox=-((cam.x*Z*1.4)%fw);if(ox>0)ox-=fw;c.globalAlpha=.88-.3*NIGHT;for(let x=ox;x<W;x+=fw)c.drawImage(fg,x,H-fh+8,fw,fh);c.globalAlpha=1}
  if(vign)c.drawImage(vign,0,0,W,H);
  if(grainPat){c.save();c.globalAlpha=.045;c.globalCompositeOperation='overlay';c.translate(Math.random()*140|0,Math.random()*140|0);c.fillStyle=grainPat;c.fillRect(-140,-140,W+140,H+140);c.restore()}
  for(const r of ripples){const k=r.t/.7;c.strokeStyle=`rgba(255,250,236,${(1-k)*.5})`;c.lineWidth=1.5;c.beginPath();c.arc(r.x,r.y,8+k*36,0,TAU);c.stroke()}
  for(const k of creatures)drawBubble(k);
  if(title.a>.01){const fs=Math.min(68,W*.11);c.save();c.globalAlpha=title.a;c.textAlign='center';c.textBaseline='middle';
    c.font=`italic 300 ${fs}px "Cormorant Garamond", Georgia, serif`;c.shadowColor='rgba(255,220,180,.55)';c.shadowBlur=24;c.fillStyle='rgba(255,249,238,.96)';
    c.fillText('a small light',W/2,H*.22);c.restore()}
}

/* ================= main loop ================= */
let last=performance.now();
function update(dt){
  time+=dt;
  if(todTw){todTw.t+=dt;const k=Math.min(1,todTw.t/todTw.d);tod=lerp(todTw.a,todTw.b,ease(k));if(k>=1)todTw=null}
  if(zoomTw){zoomTw.t+=dt;const k=Math.min(1,zoomTw.t/zoomTw.d);zoomMul=lerp(zoomTw.a,zoomTw.b,ease(k));if(k>=1)zoomTw=null}
  for(let i=waiters.length-1;i>=0;i--){if(waiters[i].fn()){const w=waiters[i];waiters.splice(i,1);w.r()}}
  for(const c of creatures)c.update(dt);
  for(const arr of [things,seeds,buds,flyers,hints]){for(const o of arr)o.update(dt);for(let i=arr.length-1;i>=0;i--)if(arr[i].dead&&(arr!==hints||arr[i].gone))arr.splice(i,1)}
  for(const t of trees)t.update(dt);
  for(const o of obs)if(o.type==='river'&&Math.abs(o.x0-cam.x)<2000)o.water.update(dt);
  updParts(dt);
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt;if(ripples[i].t>.7)ripples.splice(i,1)}
  if(NIGHT>.25&&Math.random()<dt*3*NIGHT){const x=cam.x+(Math.random()-.5)*W/Z,y=cam.y+(Math.random()-.2)*H/Z*.5;P({x,y,vx:(Math.random()-.5)*10,vy:-4,life:5+Math.random()*3,size:1.6,col:[220,255,150],type:'firefly',glow:true})}
  if(!REDUCED&&Math.random()<dt*1.2){const x=cam.x+(Math.random()-.5)*W/Z,y=cam.y+(Math.random()-.5)*H/Z*.6;P({x,y,vx:6,vy:-3,life:6,size:1.1,col:[255,240,214],type:'mote',glow:true})}
  if(endMotes&&Math.random()<dt*14){const cols=Object.values(LIGHT);const x=cam.x+(Math.random()-.5)*W/Z;P({x,y:(groundY(x)??hero.y)-4,vx:0,vy:-24-Math.random()*20,life:7,size:1.8,col:cols[Math.floor(Math.random()*4)],type:'mote',glow:true})}
  const L=leadFn()||hero;const vw=W/Math.max(Z,.01);
  const tx=camFocus?camFocus.x:L.x+vw*.08*(L.facing||1),ty=camFocus?camFocus.y:L.y-80;
  cam.x+=(tx-cam.x)*(1-Math.exp(-dt*1.6));cam.y+=(ty-cam.y)*(1-Math.exp(-dt*2));
  shake*=Math.exp(-dt*6);if(REDUCED)shake=0;
  Z=baseZoom()*zoomMul;
  title.a+=(title.target-title.a)*Math.min(1,dt*1.1);
  Music.update();
  if(AU.ctx){const t=AU.t;let wv=(started?.026:.04)*(1-NIGHT*.5);if(caves.some(o=>cam.x>o.x0&&cam.x<o.x1))wv*=.35;AU.windG.gain.setTargetAtTime(wv,t,.6);
    let wd=1e9;for(const o of obs)if(o.type==='river')wd=Math.min(wd,Math.abs(cam.x-(o.x0+o.x1)/2));AU.waterG.gain.setTargetAtTime(.075*clamp(1-wd/700,0,1),t,.4)}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000)*SPEED;last=now;update(dt);render();requestAnimationFrame(loop)}

resize();buildFG();buildGrain();
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume()});
window.__G={get hero(){return hero},kids,hints,seeds,caves,obs,get caveMode(){return caveMode},plant:(x,y)=>caveMode&&plantSeed(x,y),
  tap(){const h=hints.find(h=>!h.dead&&!h.visual);if(h){h.onTap();return true}return false},get time(){return time}};
story();
requestAnimationFrame(loop);
})();
</script>
