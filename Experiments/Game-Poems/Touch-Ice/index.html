<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touch Ice</title>
<meta name="description" content="Touch ice, because touching grass is overrated. A cinematic winter diorama where you push snow off a frozen creek, roll snowmen and throw snowballs.">
<meta name="theme-color" content="#0a121c">
<meta property="og:title" content="Touch Ice">
<meta property="og:description" content="Because touching grass is overrated.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..800&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: full-bleed WebGL stage; frosted chips float at the top (time of day) and the bottom (stats, hint, settings). Single dark look by choice. */
:root {
  --bg: #0a121c;
  --ink: #f3f7fa;
  --ink-dim: rgba(232, 241, 248, 0.72);
  --ink-faint: rgba(232, 241, 248, 0.5);
  --glass: rgba(16, 26, 38, 0.36);
  --glass-strong: rgba(12, 20, 30, 0.72);
  --edge: rgba(255, 255, 255, 0.14);
  --ember: #ffcf9a;
  --falu: #b8352b;
  --frost: #c9e7ff;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
@media (pointer: fine) { #stage canvas { cursor: none; } }

.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
  display: flex; flex-direction: column; align-items: center; gap: 18px; pointer-events: none;
}
.modes {
  pointer-events: auto; position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 4px; border-radius: 999px; background: var(--glass); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
}
.modes button {
  position: relative; z-index: 1; appearance: none; border: 0; background: none; color: var(--ink-dim);
  font: 500 13px/1 var(--f-ui); font-variation-settings: "wdth" 108; letter-spacing: 0.04em;
  padding: 9px 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
  transition: color .3s;
}
.modes button svg { width: 15px; height: 15px; flex: none; }
.modes button[aria-selected="true"] { color: #0d1824; }
.modes button:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }
.modes .thumb {
  position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3);
  border-radius: 999px; background: rgba(245, 250, 255, 0.92); box-shadow: 0 2px 10px rgba(0,0,0,.18);
  transition: transform .45s cubic-bezier(.6,.05,.25,1);
}
.title { text-align: center; transition: opacity .9s ease, transform .9s ease; }
.title h1 {
  margin: 0; font-family: var(--f-display); font-weight: 260; font-variation-settings: "wdth" 125;
  font-size: clamp(42px, 12.5vw, 84px); line-height: .95; letter-spacing: -0.02em; text-wrap: balance;
  text-shadow: 0 2px 30px rgba(0, 20, 40, .35);
}
.title h1 em { font-style: normal; color: var(--ember); }
.title p {
  margin: 10px 0 0; font-size: 14px; font-variation-settings: "wdth" 100; letter-spacing: .02em; color: var(--ink-dim);
  text-shadow: 0 1px 12px rgba(0, 20, 40, .5);
}
.title.gone { opacity: 0; transform: translateY(-8px); }
body.intro .modes, body.intro .bottom, body.intro .tag { opacity: 0 !important; pointer-events: none; }
.modes, .bottom { transition: opacity 1.4s ease; }
body.intro .title:not(.show) { opacity: 0; transform: translateY(10px); }
.title h1 { transition: letter-spacing 2.6s cubic-bezier(.2,.7,.2,1); }
body.intro .title:not(.show) h1 { letter-spacing: .1em; }

.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-direction: column; gap: 10px; align-items: stretch;
}
.hint {
  align-self: center; margin: 0; max-width: 36ch; text-align: center; font-size: 12.5px; line-height: 1.45;
  color: var(--ink-dim); text-shadow: 0 1px 10px rgba(0, 10, 20, .7); transition: opacity .8s;
}
.hint b { color: var(--ink); font-weight: 600; }
.hint.dim { opacity: .0; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stats {
  pointer-events: auto; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 9px 14px; border-radius: 14px;
  background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); min-width: 0;
}
.stats b { font-weight: 600; color: var(--ink); letter-spacing: .02em; font-variant-numeric: tabular-nums; margin-left: 5px; font-size: 12px; }
.btns { display: flex; gap: 8px; flex: none; }
.iconbtn {
  pointer-events: auto; appearance: none; width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--edge);
  background: var(--glass); color: var(--ink); display: grid; place-items: center; cursor: pointer;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: background .2s;
}
.iconbtn:hover { background: var(--glass-strong); }
.iconbtn:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }
.iconbtn svg { width: 19px; height: 19px; }

.sheet {
  position: fixed; z-index: 8; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px);
  width: min(330px, calc(100vw - 32px)); padding: 16px; border-radius: 20px; box-sizing: border-box;
  background: var(--glass-strong); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2);
  box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 14px;
}
.sheet[hidden] { display: none; }
.sheet h2 { margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--ink-faint); }
.sheet .group { display: flex; flex-direction: column; gap: 8px; }
.sheet .lbl { font-size: 13.5px; color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.07); }
.seg button {
  appearance: none; border: 0; border-radius: 9px; padding: 9px 4px; background: none; color: var(--ink-dim); cursor: pointer;
  font: 500 12.5px/1.1 var(--f-ui); font-variation-settings: "wdth" 104;
}
.seg button[aria-pressed="true"] { background: rgba(245,250,255,.92); color: #0d1824; }
.seg button:focus-visible, .wide:focus-visible, .switch input:focus-visible + i { outline: 2px solid var(--frost); outline-offset: 2px; }
.note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--ink-faint); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; cursor: pointer; }
.switch { position: relative; width: 40px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: rgba(255,255,255,.16); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .25s; }
.switch input:checked + i { background: #7fb6e0; }
.switch input:checked + i::after { transform: translateX(16px); }
.wide {
  appearance: none; border: 1px solid var(--edge); border-radius: 12px; padding: 11px; background: rgba(255,255,255,.08);
  color: var(--ink); font: 500 13.5px/1 var(--f-ui); cursor: pointer;
}
.wide:hover { background: rgba(255,255,255,.14); }

.toast {
  position: fixed; z-index: 9; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translate(-50%, -6px);
  padding: 10px 16px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); font-size: 13px; white-space: nowrap; max-width: calc(100vw - 32px);
  overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.tag {
  position: fixed; z-index: 3; left: 0; top: 0; pointer-events: none; display: flex; align-items: center; gap: 6px;
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(240,248,255,.78); white-space: nowrap;
  text-shadow: 0 1px 8px rgba(0,0,0,.6); transition: opacity .4s; font-variant-numeric: tabular-nums;
}
.tag::before { content: ""; width: 18px; height: 1px; background: currentColor; opacity: .7; }
.tag.left { flex-direction: row-reverse; }

#mitt { position: fixed; z-index: 6; left: 0; top: 0; width: 46px; height: 52px; pointer-events: none; opacity: 0; transition: opacity .2s; will-change: transform; }
#mitt svg { width: 100%; height: 100%; transition: transform .14s ease; transform-origin: 50% 20%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
#mitt.press svg { transform: scale(.88) rotate(6deg); }
#mitt.on { opacity: 1; }

.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; line-height: 1.5; color: var(--ink-dim); }

@media (min-width: 720px) {
  .bottom { padding-left: 22px; padding-right: 22px; }
  .hint { font-size: 13px; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  .title, .toast, .modes .thumb, .hint { transition: none; }
}
</style>
</head>
<body>
<div id="stage"></div>

<header class="top">
  <nav class="modes" role="tablist" aria-label="Time of day">
    <span class="thumb" id="thumb"></span>
    <button role="tab" data-mode="day" aria-selected="true" id="m-day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>Day</button>
    <button role="tab" data-mode="dusk" aria-selected="false" id="m-dusk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 16a5.5 5.5 0 0 1 11 0"/><path d="M2.5 16h19M5 20h14M12 5v2.5M4.8 8.8l1.6 1.6M19.2 8.8l-1.6 1.6"/></svg>Dusk</button>
    <button role="tab" data-mode="night" aria-selected="false" id="m-night">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1Z"/></svg>Night</button>
  </nav>
  <div class="title" id="title">
    <h1>touch ice<em>.</em></h1>
    <p>because touching grass is overrated</p>
  </div>
</header>

<footer class="bottom">
  <p class="hint" id="hint"></p>
  <div class="bar">
    <div class="stats">
      <span>Ice cleared<b id="sIce">0%</b></span>
      <span>Snow moved<b id="sSnow">0 kg</b></span>
      <span>Air<b id="sTemp">−8 °C</b></span>
    </div>
    <div class="btns"><button class="iconbtn" id="viewBtn" aria-label="Show the whole scene"></button>
    <button class="iconbtn" id="gear" aria-label="Settings" aria-expanded="false" aria-controls="sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button></div>
  </div>
</footer>

<section class="sheet" id="sheet" hidden aria-label="Settings">
  <h2>Settings</h2>
  <div class="group">
    <span class="lbl">Render quality</span>
    <div class="seg" id="qSeg">
      <button data-q="low" aria-pressed="false" id="q-low">Phone</button>
      <button data-q="med" aria-pressed="false" id="q-med">Balanced</button>
      <button data-q="high" aria-pressed="false" id="q-high">Cinematic</button>
    </div>
    <p class="note" id="qNote"></p>
  </div>
  <label class="row" for="optSnow"><span>Falling snow</span><span class="switch"><input type="checkbox" id="optSnow" checked><i></i></span></label>
  <label class="row" for="optSound"><span>Sound</span><span class="switch"><input type="checkbox" id="optSound" checked><i></i></span></label>
  <label class="row" for="optTags"><span>Cross-section labels</span><span class="switch"><input type="checkbox" id="optTags" checked><i></i></span></label>
  <button class="wide" id="btnReset">Fresh snowfall</button>
</section>

<div class="toast" id="toast" role="status"></div>
<div class="tag" id="tagIce">Ice <span id="tagIceV">12 cm</span></div>
<div class="tag" id="tagSnow">Snowpack <span id="tagSnowV">30 cm</span></div>

<div id="mitt" aria-hidden="true">
  <svg viewBox="0 0 64 72"><g transform="rotate(-14 32 40)">
    <path d="M19 45C15 34 15 18 23 11.5c6-4.5 16-3.5 19.5 3.5 2 4.5 2.2 13 2.2 19.5l3.8-5.6c2-2.8 7-1.6 6 3.2L49.6 47c-1.6 4.8-5.6 7.6-11 7.6H26.4c-3.8 0-6.4-3.6-7.4-9.6Z" fill="#b8352b" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M20.5 41.5h27" stroke="#f3e6d6" stroke-width="3" stroke-dasharray="3.2 3.2"/>
    <path d="M22 35.5l3 2.4 3-2.4 3 2.4 3-2.4 3 2.4 3-2.4 3 2.4" stroke="#f3e6d6" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <rect x="21.5" y="53.5" width="25" height="10" rx="3.5" fill="#eee4d6" stroke="#fff" stroke-width="2.2"/>
  </g></svg>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================================
   Small helpers
   ========================================================================= */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function hash2i(i, j) {
  let h = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2i(xi, yi), b = hash2i(xi + 1, yi), c = hash2i(xi, yi + 1), d = hash2i(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; } return s / n; }
function vnoise3(x, y, z) {
  const zi = Math.floor(z), zf = z - zi, w = zf * zf * (3 - 2 * zf);
  return lerp(vnoise(x + zi * 31.7, y - zi * 17.1), vnoise(x + (zi + 1) * 31.7, y - (zi + 1) * 17.1), w);
}
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const dirFrom = (az, el) => { const a = az * Math.PI / 180, e = el * Math.PI / 180; return [Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e)]; };
const isTouch = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k, d) { try { const v = localStorage.getItem('touchice:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('touchice:' + k, JSON.stringify(v)); } catch (e) {} } };

/* =========================================================================
   World layout (metres). The block is W wide (x) and L deep (z).
   ========================================================================= */
const W = 8, L = 11, DX = 0.05;
const NX = Math.round(W / DX) + 1, NZ = Math.round(L / DX) + 1, NCELL = NX * NZ;
const ICE_Y = -0.38, ICE_T = 0.12, BASE_Y = -1.9;
const CELL_A = DX * DX, SNOW_DENSITY = 250; // settled snow, kg per cubic metre
const HAND_R = 0.28;

const creekX = (z) => -0.45 + 1.0 * Math.sin(0.38 * z + 0.3) + 0.18 * Math.sin(1.1 * z + 1.7);
const creekHW = (z) => 1.05 + 0.22 * Math.sin(0.7 * z + 2.0);
function rawGround(x, z) {
  const d = Math.abs(x - creekX(z)), hw = creekHW(z);
  const t = smoothstep(hw - 0.3, hw + 1.6, d);
  const bank = 0.02 + 0.32 * (fbm(x * 0.32 + 3.1, z * 0.32 - 1.7, 3) - 0.5) + Math.max(0, -z) * 0.035 + Math.max(0, Math.abs(x) - 2.6) * 0.07;
  const bed = -0.86 + 0.12 * (fbm(x * 1.2, z * 1.2, 2) - 0.5);
  return lerp(bed, bank, t);
}
function iceEdgeRight(z) { let x = creekX(z); while (x < W / 2 && rawGround(x, z) < ICE_Y) x += 0.01; return x; }

const AV_Z = -1.6;
const EDGE_AV = iceEdgeRight(AV_Z);
const AV = { x: EDGE_AV - 0.82, z: AV_Z, rx: 0.5, rz: 0.36 };
const CAB = { w: 2.0, d: 2.4, z: -2.75 };
CAB.x = iceEdgeRight(CAB.z) + 1.05 + CAB.w / 2;
CAB.y = rawGround(CAB.x, CAB.z) + 0.04;
const PIER = { x0: AV.x + AV.rx * 0.82, x1: EDGE_AV + 0.85, z: AV_Z, w: 0.78 };
PIER.y = Math.max(rawGround(PIER.x1, AV_Z), rawGround(PIER.x1 - 0.3, AV_Z)) + 0.1;
const DOOR = { x: CAB.x - 0.42, z: CAB.z + CAB.d / 2 };

function sdBox(px, pz, bx, bz) { const qx = Math.abs(px) - bx, qz = Math.abs(pz) - bz; return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0); }
function groundAt(x, z) {
  let g = rawGround(x, z);
  const m = 1 - smoothstep(0.0, 0.7, sdBox(x - CAB.x, z - CAB.z, CAB.w / 2 + 0.2, CAB.d / 2 + 0.2));
  g = lerp(g, CAB.y - 0.04, m);
  return g;
}

/* =========================================================================
   Snow simulation state
   ========================================================================= */
const G = new Float32Array(NCELL);       // ground (bank or creek bed)
const BASEH = new Float32Array(NCELL);   // what snow rests on: ground or ice
const SNOW = new Float32Array(NCELL * 2); // [depth m, disturbed 0..1]
const INIT = new Float32Array(NCELL);
const SOLID = new Uint8Array(NCELL), HOLE = new Uint8Array(NCELL), ICEC = new Uint8Array(NCELL);
const cx = (i) => -W / 2 + i * DX, cz = (j) => -L / 2 + j * DX;
const toI = (x) => (x + W / 2) / DX, toJ = (z) => (z + L / 2) / DX;
const segDist = (px, pz, ax, az, bx, bz) => { const vx = bx - ax, vz = bz - az; const t = clamp(((px - ax) * vx + (pz - az) * vz) / (vx * vx + vz * vz), 0, 1); return Math.hypot(px - ax - vx * t, pz - az - vz * t); };
const inHole = (x, z) => { const a = (x - AV.x) / AV.rx, b = (z - AV.z) / AV.rz; return a * a + b * b < 0.92; };

for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
  const k = j * NX + i, x = cx(i), z = cz(j);
  const g = groundAt(x, z); G[k] = g; BASEH[k] = Math.max(g, ICE_Y);
  ICEC[k] = g < ICE_Y ? 1 : 0;

        const m = Math.min(dxm, dxp, dzp, dzm);
        if (m === dxm) p.x = b.min.x - 0.15; else if (m === dxp) p.x = b.max.x + 0.15; else if (m === dzp) p.z = b.max.z + 0.15; else p.z = b.min.z - 0.15;
        p.x = clamp(p.x, -W / 2 + 0.05, W / 2 - 0.05); p.z = clamp(p.z, -L / 2 + 0.05, L / 2 - 0.05);
        puff.emit(p.x, p.y, p.z, 30, 1.2, 0.6, 1.3); Sfx.thud(0.7);
        deposit(p.x, p.z, pr.vol / CELL_A, 0.18, 0.18); done = true;
      }
      if (!done) for (const b of balls) { if (pr.pos.distanceTo(b.mesh.position) < pr.r + b.r * 0.95) { breakBall(b); land(pr); done = true; break; } }
      if (!done) { const h = surfaceH(pr.pos.x, pr.pos.z); if (pr.pos.y - pr.r * 0.5 <= h && pr.vel.y < 0) { pr.pos.y = h; land(pr); done = true; } }
    } else if (pr.pos.y < BASE_Y - 3) done = true;
    if (done || pr.age > 6) { scene.remove(pr.mesh); projectiles.splice(q, 1); }
    shadowDirty = true;
  }
  if (held) shadowDirty = true;

  // trees
  for (const tr of TREES) {
    if (Math.abs(tr.ang) < 1e-4 && Math.abs(tr.vel) < 1e-4) continue;
    const acc = -60 * tr.ang - 3.2 * tr.vel; tr.vel += acc * dt; tr.ang += tr.vel * dt;
    tr.pivot.rotation.set(Math.cos(tr.ax) * tr.ang * 0.05, 0, Math.sin(tr.ax) * tr.ang * 0.05);
    shadowDirty = true;
  }
  // cracks grow in
  for (const v of U.uCracks.value) if (v.z > 0 && v.z < (v.target || 1)) v.z = Math.min(v.target || 1, v.z + dt * 7);
  puff.update(dt);

  // hand ring
  hand.a = lerp(hand.a, hand.at * (held ? 0 : 1), 1 - Math.exp(-dt * 14));
  U.uHand.value.set(hand.x, hand.z, HAND_R, hand.a);

  if (snowDirty) { snowTex.needsUpdate = true; snowDirty = false; shadowDirty = true; }

  // render
  if (envDirty) { updateEnv(); envDirty = false; }
  if (shadowDirty || clock.t < 1) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  if (reflRT) renderReflection();
  skyU.uLift.value = liftVal;
  if (finalPass) {
    _proj.copy(view.look).project(camera); finalPass.uniforms.uFocus.value = _proj.y * 0.5 + 0.5; finalPass.uniforms.uTime.value = clock.t;
  }
  composer.render();

  // labels and stats
  placeTag(tagIce, TAG_ICE_P, false);
  TAG_SNOW_P.y = BASEH[(NZ - 1) * NX + Math.round(toI(TAG_SNOW_X))] + depthAt(TAG_SNOW_X, L / 2 - 0.01) * 0.5;
  placeTag(tagSnow, TAG_SNOW_P, false);
  statT -= dt;
  if (statT <= 0) {
    statT = 0.35;
    let n = 0, clr = 0;
    for (let k = 0; k < NCELL; k++) if (ICEC[k] && !HOLE[k]) { n++; if (SNOW[k * 2] < 0.015) clr++; }
    const pct = Math.round((clr / n) * 100);
    $('#sIce').textContent = pct + '%';
    $('#sSnow').textContent = movedKg < 1000 ? Math.round(movedKg) + ' kg' : (movedKg / 1000).toFixed(2) + ' t';
    $('#tagSnowV').textContent = Math.round(depthAt(TAG_SNOW_X, L / 2 - 0.01) * 100) + ' cm';
    if (pct >= 85 && !frame.rink) { frame.rink = true; toast('That is a rink now. Skates not included.'); Sfx.chime(); }
  }

  // adapt quality once if the device is struggling
  if (!userPickedQuality && !perf.done && view.intro >= 1) {
    perf.warm += dt;
    if (perf.warm > 2) { perf.acc += dt; perf.n++; }
    if (perf.n >= 150) {
      const avg = perf.acc / perf.n; perf.done = true;
      if (avg > 1 / 28 && opts.quality !== 'low') {
        const next = opts.quality === 'high' ? 'med' : 'low';
        applyQuality(next, `Switched to ${next === 'med' ? 'Balanced' : 'Phone'} quality for smoother motion.`);
      }
    }
  }
}

/* =========================================================================
   Boot
   ========================================================================= */
window.addEventListener('resize', () => { buildPipeline(); fitCamera(); if (view.zoomT < 0.8) view.zoomT = playZoom(); });
document.body.classList.add('intro');
if (reduceMotion) { document.body.classList.remove('intro'); $('#title').classList.add('show'); }
setMode(store.get('mode', 'night'), true);
applyMode();
applyQuality(opts.quality);
view.azT = view.az = 0; view.elT = view.el = 0.72;
fitCamera();
view.zoomT = playZoom(); if (reduceMotion) view.zoom = view.zoomT;
syncViewBtn();
requestAnimationFrame((t) => { clock.last = t; frame(t); });
</script>
</body>
