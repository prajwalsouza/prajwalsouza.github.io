<meta charset="utf-8">
<title>Invisible Causes</title>
<meta name="description" content="A continuous hand-drawn animation on least squares, Student's t, regression, path analysis, latent variables and causal inference.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@300;400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ebe7de;--ink:#2a2926;--ink2:#5b5750;--ink3:#8f8a80;--rule:#cdc7ba;--teal:#16867f;--teal-soft:rgba(22,134,127,.16);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,"Times New Roman",serif;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto auto;padding-inline:16px;box-sizing:border-box}
#stage{position:relative;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#cap{width:100%;max-width:66ch;margin:0 auto;text-align:center;font-size:clamp(16px,1.5vw,21px);line-height:1.42;min-height:4.4em;padding-block:2px 4px;display:flex;align-items:center;justify-content:center;text-wrap:balance}
#cap .line{display:block;animation:capIn .8s ease both}
.voice #cap .w{color:var(--ink3);transition:color .25s,background .25s;border-radius:3px}
.voice #cap .w.past{color:var(--ink)}
.voice #cap .w.on{color:var(--ink);background:var(--teal-soft);box-shadow:0 0 0 2px var(--teal-soft)}
#voice[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@keyframes capIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#hint{display:none;text-align:center;font-size:13px;color:var(--ink2);font-style:italic;padding-block:2px}
#bar{display:flex;align-items:center;gap:10px;padding-block:4px 14px;width:100%;max-width:1180px;margin:0 auto;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
#bar button{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--ink);height:34px;min-width:34px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;padding-inline:10px;transition:background .2s,border-color .2s}
#bar button:hover{background:rgba(42,41,38,.06);border-color:var(--ink3)}
#bar button:focus-visible,#track:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#bar svg{width:14px;height:14px;fill:currentColor}
#play{width:44px;height:44px!important;border-radius:22px!important;border-color:var(--ink)!important}
#track{position:relative;flex:1;height:34px;cursor:pointer;touch-action:none;outline:none;border-radius:4px}
#track .rail{position:absolute;left:0;right:0;top:16px;height:2px;background:var(--rule);border-radius:1px}
#track .fill{position:absolute;left:0;top:16px;height:2px;background:var(--ink);border-radius:1px}
#track .tick{position:absolute;top:11px;width:1px;height:12px;background:var(--ink3)}
#track .knob{position:absolute;top:10px;width:14px;height:14px;border-radius:50%;background:var(--teal);margin-left:-7px;box-shadow:0 0 0 4px var(--teal-soft)}
#tip{position:absolute;bottom:32px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--paper);padding:4px 9px;border-radius:3px;font-size:12px;pointer-events:none;font-family:"Newsreader",Georgia,serif;font-style:italic}
#time{min-width:9.5ch;text-align:right}
@media (max-width:700px){#time{display:none}#bar{gap:6px}#bar button{min-width:30px;height:30px;padding-inline:6px}}
@media (orientation:portrait) and (max-width:700px){#hint{display:block}}
@media (prefers-reduced-motion:reduce){#cap .line{animation:none}}
</style>

<div id="app">
  <div id="stage"><canvas id="c" aria-label="Hand-drawn animation illustrating the history of statistical modeling" role="img"></canvas></div>
  <div id="hint">Turn your phone sideways for a larger view.</div>
  <div id="cap" aria-live="polite"></div>
  <div id="bar">

    <button id="play" type="button" aria-label="Pause"><svg viewBox="0 0 16 16" id="pi"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
    <button id="next" type="button" aria-label="Next chapter"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>

      <div class="rail"></div><div class="fill"></div><div class="knob"></div><div id="tip" hidden></div>
    </div>

    <button id="speed" type="button" aria-label="Playback speed">1×</button>
  </div>
</div>

<script>
(()=>{
/* ================================================================
   Palette, fonts, stage
   ================================================================ */
const W=1600,H=900;
const C={ink:'#2a2926',ink2:'#5b5750',ink3:'#8f8a80',faint:'#c4beb1',paper:'#ebe7de',sheet:'#f6f3ec',
  teal:'#16928b',orange:'#d27d27',red:'#bd3d2a',brass:'#b08d4a',light:'#ebe6da',grain:'#c9a25a'};
const F={hand:'"Kalam","Segoe Print","Bradley Hand",cursive',title:'"IM Fell English",Georgia,serif',
  serif:'"Newsreader",Georgia,serif',mono:'"IBM Plex Mono",ui-monospace,Menlo,monospace'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let GA=1,boil=0,ci=0;

/* ================================================================
   Math utilities
   ================================================================ */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const EP=(t,a,b)=>ease(P(t,a,b));
const io=(t,a,b,c,d)=>Math.min(EP(t,a,b),1-EP(t,c,d));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}
function h32(n){n=n|0;n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);n^=n>>>16;return(n>>>0)/4294967296}
function vn(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return h32(i*374761+s*668265)*(1-u)+h32((i+1)*374761+s*668265)*u-.5}
function rgba(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const f2=(v,d=2)=>(v<-1e-9?'−':'')+Math.abs(v).toFixed(d);
const dec=(v,d=2)=>(v<0?'−':'')+Math.abs(v).toFixed(d).replace(/^0/,'');
function solve3(A,b){const M=A.map((r,i)=>[...r,b[i]]);for(let c=0;c<3;c++){let p=c;for(let r=c+1;r<3;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];for(let r=0;r<3;r++){if(r===c)continue;const f=M[r][c]/M[c][c];for(let k=c;k<4;k++)M[r][k]-=f*M[c][k]}}return M.map((r,i)=>r[3]/r[i])}
function corr(a,b){const n=a.length;let ma=0,mb=0;for(let i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;let s=0,sa=0,sb=0;for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;s+=x*y;sa+=x*x;sb+=y*y}return s/Math.sqrt(sa*sb)}
const npdf=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
const t2pdf=x=>1/(2*Math.SQRT2)*Math.pow(1+x*x/2,-1.5);

/* ================================================================
   Pencil primitives
   ================================================================ */
function strokePts(a,o={}){
  const p=o.p??1;if(p<=0||a.length<2)return;
  const n=a.length,L=new Float32Array(n);
  for(let i=1;i<n;i++)L[i]=L[i-1]+Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]);
  const lim=L[n-1]*Math.min(1,p);
  const w=o.w??1.6,al=GA*(o.a??1),jit=o.j??1,passes=o.n??2,s=(++ci)*131+(o.seed||0);
  ctx.strokeStyle=o.c||C.ink;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(o.dash||[]);
  for(let k=0;k<passes;k++){
    const sd=s+k*977+boil*7919;
    ctx.globalAlpha=al*(k?0.45:0.92);ctx.lineWidth=k?w*0.62:w;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      let x=a[i][0],y=a[i][1],li=L[i];
      if(li>lim){const f=(lim-L[i-1])/((li-L[i-1])||1);x=a[i-1][0]+(x-a[i-1][0])*f;y=a[i-1][1]+(y-a[i-1][1])*f;li=lim}
      const q=li/24;x+=vn(q,sd)*jit*2.2;y+=vn(q,sd+71)*jit*2.2;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      if(li>=lim)break;
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function segPts(x1,y1,x2,y2){const n=Math.max(2,Math.ceil(Math.hypot(x2-x1,y2-y1)/14)),a=[];for(let i=0;i<=n;i++)a.push([x1+(x2-x1)*i/n,y1+(y2-y1)*i/n]);return a}
function line(x1,y1,x2,y2,o={}){strokePts(segPts(x1,y1,x2,y2),o)}
function dline(x1,y1,x2,y2,o={}){strokePts(segPts(x1,y1,x2,y2),{n:1,dash:[8,7],...o})}
function circle(x,y,r,o={}){const n=Math.max(18,Math.ceil(r*.7)),a=[],s0=o.start??-1.9,sw=o.sweep??(Math.PI*2+.22);for(let i=0;i<=n;i++){const th=s0+sw*i/n;a.push([x+Math.cos(th)*r,y+Math.sin(th)*r])}strokePts(a,o)}
function ellipse(x,y,rx,ry,rot,o={}){const n=Math.max(24,Math.ceil((rx+ry)*.5)),a=[],c=Math.cos(rot),s=Math.sin(rot),s0=o.start??-1.9,sw=o.sweep??(Math.PI*2+.2);for(let i=0;i<=n;i++){const th=s0+sw*i/n,px=Math.cos(th)*rx,py=Math.sin(th)*ry;a.push([x+px*c-py*s,y+px*s+py*c])}strokePts(a,o)}
function rectS(x,y,w,h,o={}){const p=o.p??1,ov=o.ov??4;const sides=[[x-ov,y,x+w+ov,y],[x+w,y-ov,x+w,y+h+ov],[x+w+ov,y+h,x-ov,y+h],[x,y+h+ov,x,y-ov]];sides.forEach((s,i)=>{const q=clamp(p*4-i);if(q>0)line(s[0],s[1],s[2],s[3],{...o,p:q})})}
function cumL(a){const L=[0];for(let i=1;i<a.length;i++)L.push(L[i-1]+Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]));return L}
function at(a,p){const L=cumL(a),n=a.length,lim=L[n-1]*clamp(p);for(let i=1;i<n;i++){if(L[i]>=lim){const f=(lim-L[i-1])/((L[i]-L[i-1])||1);return{x:a[i-1][0]+(a[i][0]-a[i-1][0])*f,y:a[i-1][1]+(a[i][1]-a[i-1][1])*f,dx:a[i][0]-a[i-1][0],dy:a[i][1]-a[i-1][1]}}}const q=a[n-1],r=a[n-2];return{x:q[0],y:q[1],dx:q[0]-r[0],dy:q[1]-r[1]}}
function trim(a,s0,s1){if(!s0&&!s1)return a;const L=cumL(a),T=L[L.length-1];if(T<=s0+s1+1)return[a[0],a[a.length-1]];const A=at(a,s0/T),B=at(a,(T-s1)/T),out=[[A.x,A.y]];for(let i=0;i<a.length;i++)if(L[i]>s0&&L[i]<T-s1)out.push(a[i]);out.push([B.x,B.y]);return out}
function arrow(x1,y1,x2,y2,o={}){
  const p=o.p??1;if(p<=0)return;
  const b=o.bend||0,mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,Ln=Math.hypot(dx,dy)||1,cx=mx-dy/Ln*b,cy=my+dx/Ln*b;
  let a=[];const n=Math.max(8,Math.ceil(Ln/12));
  for(let i=0;i<=n;i++){const u=i/n;a.push([(1-u)*(1-u)*x1+2*(1-u)*u*cx+u*u*x2,(1-u)*(1-u)*y1+2*(1-u)*u*cy+u*u*y2])}
  a=trim(a,o.s0||0,o.s1||0);strokePts(a,o);
  if(o.head===false||p<.03)return;
  const tp=at(a,p),ang=Math.atan2(tp.dy,tp.dx),hl=o.hl||15,ho={...o,p:1,dash:null,n:1,w:(o.w||1.6)};
  line(tp.x,tp.y,tp.x-Math.cos(ang-.42)*hl,tp.y-Math.sin(ang-.42)*hl,ho);
  line(tp.x,tp.y,tp.x-Math.cos(ang+.42)*hl,tp.y-Math.sin(ang+.42)*hl,ho);
}
function hatch(path,bb,o={}){
  const p=o.p??1;if(p<=0)return;
  ctx.save();ctx.beginPath();path();ctx.clip();
  const ang=o.ang??-.9,gap=o.gap??7;ctx.strokeStyle=o.c||C.ink;ctx.lineWidth=o.w??1;ctx.globalAlpha=GA*(o.a??.5);ctx.setLineDash([]);
  const[x,y,w,h]=bb,cx=x+w/2,cy=y+h/2,R=Math.hypot(w,h)/2+6,ca=Math.cos(ang),sa=Math.sin(ang),s=(++ci)*31;
  ctx.beginPath();let k=0;
  for(let d=-R;d<=-R+2*R*p;d+=gap,k++){const j=(h32(s+k*7+boil*131)-.5)*gap*.4,px=cx-sa*(d+j),py=cy+ca*(d+j);ctx.moveTo(px-ca*R,py-sa*R);ctx.lineTo(px+ca*R,py+sa*R)}
  ctx.stroke();ctx.restore();
}
function fillP(path,col,a=1){ctx.globalAlpha=GA*a;ctx.fillStyle=col;ctx.beginPath();path();ctx.fill()}
function T(s,x,y,o={}){
  s=String(s);let al=o.al||'center';
  ctx.font=`${o.st||'normal'} ${o.wt||400} ${o.s||26}px ${F[o.f||'hand']}`;
  if(o.p!==undefined){if(o.p<=0)return;const full=ctx.measureText(s).width;if(al==='center'){x-=full/2;al='left'}else if(al==='right'){x-=full;al='left'}s=s.slice(0,Math.ceil(s.length*clamp(o.p)))}
  ctx.globalAlpha=GA*(o.a??1);ctx.fillStyle=o.c||C.ink;ctx.textAlign=al;ctx.textBaseline=o.bl||'middle';ctx.fillText(s,x,y);
}
function dot(x,y,r,col=C.teal,a=1){if(a<=0)return;ctx.globalAlpha=GA*a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=GA*a*.45;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-r*.3,y-r*.32,r*.36,0,7);ctx.fill();ctx.globalAlpha=GA*a*.7;ctx.strokeStyle=C.ink;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke()}
function glow(x,y,r,col=C.teal,a=1){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r*4.5);g.addColorStop(0,rgba(col,.38*a));g.addColorStop(1,rgba(col,0));ctx.globalAlpha=GA;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*4.5,0,7);ctx.fill();dot(x,y,r,col,a)}
function ball(x,y,r,a=1){const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);g.addColorStop(0,'#f3e6bf');g.addColorStop(.45,'#c4a360');g.addColorStop(1,'#5a4520');ctx.globalAlpha=GA*a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();circle(x,y,r,{w:1.1,a:.75*a,j:.4})}
function node(x,y,label,o={}){const r=o.r||34,p=o.p??1,a=o.a??1;if(p<=0)return;if(o.fill)fillP(()=>ctx.arc(x,y,r,0,7),o.fill,(o.fa??.14)*a*clamp(p*1.5));circle(x,y,r,{p,w:o.w||1.8,c:o.c||C.ink,dash:o.dash,a});T(label,x,y+2,{s:o.s||30,a:a*clamp((p-.4)*2),c:o.tc||C.ink,f:o.f||'hand'})}
function box(x,y,w,h,label,o={}){const p=o.p??1,a=o.a??1;if(p<=0)return;if(o.fill)fillP(()=>ctx.rect(x-w/2,y-h/2,w,h),o.fill,(o.fa??.12)*a);rectS(x-w/2,y-h/2,w,h,{p,w:o.w||1.6,c:o.c,a,ov:3});T(label,x,y+2,{s:o.s||24,a:a*clamp((p-.4)*2),c:o.tc||C.ink})}
function cross(x,y,s,o={}){line(x-s,y-s,x+s,y+s,{c:C.red,w:2.4,...o});line(x+s,y-s,x-s,y+s,{c:C.red,w:2.4,...o})}
function cam3(o){const cy=Math.cos(o.yaw),sy=Math.sin(o.yaw),cp=Math.cos(o.pitch),sp=Math.sin(o.pitch);return(x,y,z)=>{const xr=x*cy-y*sy,yr=x*sy+y*cy,up=z*cp+yr*sp,dep=yr*cp-z*sp,f=o.d/(o.d+dep);return[o.ox+xr*o.s*f,o.oy-up*o.s*f,dep]}}
function seg3(pr,A,B,o){const a=pr(...A),b=pr(...B);line(a[0],a[1],b[0],b[1],o)}
function plainLine(x1,y1,x2,y2,col,w,a){ctx.globalAlpha=GA*a;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function catmull(Pp,n=10){const out=[];for(let i=0;i<Pp.length-1;i++){const p0=Pp[Math.max(0,i-1)],p1=Pp[i],p2=Pp[i+1],p3=Pp[Math.min(Pp.length-1,i+2)];for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;out.push([0,1].map(d=>.5*(2*p1[d]+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3)))}}out.push(Pp[Pp.length-1]);return out}
function withAlpha(a,fn){if(a<=0)return;const g=GA;GA*=a;fn();GA=g}

/* A piebald guinea pig, drawn in pencil */
function pig(x,y,s,o={}){
  const p=o.p??1;if(p<=0)return;const f=o.flip?-1:1,r=rng(o.seed||1);
  ctx.save();ctx.translate(x,y);ctx.scale(s*f,s);
  const body=[];for(let i=0;i<=56;i++){const a=Math.PI*2*i/56,b=1+.05*Math.sin(a*3+1);body.push([Math.cos(a)*80*b-6,Math.sin(a)*46*b-(Math.sin(a)<0?5*Math.cos(a):0)])}
  if(p>.55){const pa=clamp((p-.55)/.45);ctx.save();ctx.beginPath();body.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.moveTo(91,-14);ctx.arc(60,-14,31,0,Math.PI*2);ctx.clip();
    const np=o.patches||3;for(let k=0;k<np;k++){const cx=-70+r()*150,cy=-44+r()*76,rx=20+r()*28,ry=14+r()*20,ro=r()*3;hatch(()=>ctx.ellipse(cx,cy,rx,ry,ro,0,Math.PI*2),[cx-rx-6,cy-rx-6,2*rx+12,2*rx+12],{gap:3.4,a:.8*pa,c:o.pc||C.ink2,ang:-.8,w:1.15})}
    ctx.restore()}
  strokePts(body,{p:clamp(p*1.6),w:2.3,c:o.c});
  circle(60,-14,31,{p:clamp(p*1.6-.3),w:2.3,start:-2.5,sweep:4.3,c:o.c});

  u.onend=()=>{if(utt!==u)return;speakDone=true;const el=(performance.now()-speakT0)/1000;if(el>1)cps=lerp(cps,text.length/(el*r),.35)};
  u.onerror=()=>{if(utt===u)speakDone=true};
  synth.speak(u)}
function stopVoice(){if(synth){utt=null;synth.cancel()}spokenKey='';speakDone=true}
function setCaption(text){capEl.textContent='';const b=document.createElement('span');b.className='line';let off=0;
  text.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok))b.appendChild(document.createTextNode(tok));
    else{const w=document.createElement('span');w.className='w';w.dataset.c=off;w.textContent=tok;b.appendChild(w)}off+=tok.length});
  capEl.appendChild(b);words=[...b.querySelectorAll('.w')];capLen=text.length;wIdx=-2}
function highlight(){let k=-1;
  if(!speakDone&&utt){let frac;if(bIdx>=0)frac=bIdx/spokenLen;else frac=(performance.now()-speakT0)/1000/segEst;
    const ch=clamp(frac)*capLen;for(let i=0;i<words.length;i++)if(+words[i].dataset.c<=ch+.5)k=i}
  else if(spokenKey)k=words.length;
  if(k===wIdx)return;wIdx=k;words.forEach((w,i)=>{w.classList.toggle('past',i<k);w.classList.toggle('on',i===k)})}
function setVoice(on){voiceOn=on&&!!synth;voiceBtn.setAttribute('aria-pressed',String(voiceOn));document.body.classList.toggle('voice',voiceOn);
  stopVoice();if(voiceOn){if(!playing)setPlaying(true);speakSeg(segInfo(clock))}
  try{localStorage.setItem('sem-voice',voiceOn?'1':'0')}catch(e){}}
voiceBtn.onclick=()=>setVoice(!voiceOn);
window.addEventListener('keydown',e=>{if(e.key==='v'||e.key==='V')setVoice(!voiceOn)});
document.getElementById('prev').addEventListener('click',stopVoice);document.getElementById('next').addEventListener('click',stopVoice);
function loop(now){
  const dt=Math.min(.1,(now-(last||now))/1000);last=now;
  if(playing&&!dragging){
    if(voiceOn&&synth){const g=segInfo(clock);if(g.key!==spokenKey)speakSeg(g);
      let rate=speed;if(!speakDone)rate=speed*Math.min(1,(g.end-g.start)/Math.max(.1,segEst));
      let next=clock+dt*rate;if(!speakDone&&next>g.hold)next=Math.max(clock,g.hold);clock=next}
    else clock+=dt*speed;
    if(clock>=TOTAL)clock-=TOTAL}
  boil=reduce?0:Math.floor(now/120)%997;
  render();requestAnimationFrame(loop);
}
function setPlaying(p){playing=p;if(!p)stopVoice();playBtn.setAttribute('aria-label',p?'Pause':'Play');pi.innerHTML=p?'<path d="M3 2h4v12H3zM9 2h4v12H9z"/>':'<path d="M4 2l10 6-10 6z"/>'}
playBtn.onclick=()=>setPlaying(!playing);
document.getElementById('prev').onclick=()=>{const i=sceneAt(clock);clock=(clock-starts[i]>2||i===0)?starts[i]:starts[i-1]};
document.getElementById('next').onclick=()=>{const i=sceneAt(clock);clock=i<scenes.length-1?starts[i+1]:0};
const speeds=[1,1.5,2,.75];speedBtn.onclick=()=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];speedBtn.textContent=speed+'×';stopVoice()};
const xToT=e=>{const r=track.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width)*TOTAL*.99999};
track.addEventListener('pointerdown',e=>{dragging=true;stopVoice();track.setPointerCapture(e.pointerId);clock=xToT(e)});
track.addEventListener('pointermove',e=>{const v=xToT(e),r=track.getBoundingClientRect();tip.hidden=false;tip.style.left=(e.clientX-r.left)+'px';const i=sceneAt(v);tip.textContent=`${String(i+1).padStart(2,'0')} · ${scenes[i].title}`;if(dragging)clock=v});
const endDrag=()=>{dragging=false};track.addEventListener('pointerup',endDrag);track.addEventListener('pointercancel',endDrag);track.addEventListener('pointerleave',()=>{tip.hidden=true});
track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){clock=Math.min(TOTAL-.01,clock+5);e.preventDefault()}if(e.key==='ArrowLeft'){clock=Math.max(0,clock-5);e.preventDefault()}});
window.addEventListener('keydown',e=>{if(e.target===track&&e.key.startsWith('Arrow'))return;if(e.code==='Space'&&e.target.tagName!=='BUTTON'){setPlaying(!playing);e.preventDefault()}
  if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});
if(location.hash){const n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=scenes.length)clock=starts[n-1]}
if(document.fonts&&document.fonts.load){['26px Kalam','26px "IM Fell English"','italic 26px "IM Fell English"','20px "IBM Plex Mono"'].forEach(f=>document.fonts.load(f).catch(()=>{}))}
requestAnimationFrame(loop);
})();
</script>
