name: Publish Contour temporary transfer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-contour-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Recover and copy exact standalone Contour HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Experiments/Cycling/Contour /tmp/parts
          for n in 01 02 03 04 05 06 07 08; do
            curl --fail --silent --show-error --location --retry 3 "https://contour-cycling-hi6evz.v2.appdeploy.ai/contour-parts/part-${n}.txt" -o "/tmp/parts/${n}"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,string,sys
          parts=[Path(f'/tmp/parts/{n:02}').read_text().strip() for n in range(1,9)]
          expected='891c5ac042ca01cb7d0838fe3de665b9c358cbe027f07c12c61acceb5455be39'
          alphabet=string.ascii_uppercase+string.ascii_lowercase+string.digits+'+/'
          prefix=''.join(parts[:3])
          suffix=''.join(parts[3:])
          found=None
          for ch in alphabet:
              s=prefix+ch+suffix
              s += '='*((4-len(s)%4)%4)
              try:
                  html=gzip.decompress(base64.b64decode(s,validate=True))
              except Exception:
                  continue
              if len(html)==152731 and hashlib.sha256(html).hexdigest()==expected:
                  found=(ch,html)
                  break
          if not found:
              print('No exact recovery at the part-03 boundary; refusing to publish.')
              sys.exit(21)
          print('Recovered missing Base64 character:',found[0])
          Path('Experiments/Cycling/Contour/index.html').write_bytes(found[1])
          print('Verified exact SHA-256:',expected)
          PY

      - name: Commit standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Contour Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add Experiments/Cycling/Contour/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Contour cycling experiment [skip ci]'
          git push origin master
