name: Publish Contour temporary transfer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-contour-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Inspect and copy canonical Contour HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Experiments/Cycling/Contour /tmp/contour-parts
          : > /tmp/contour.b64
          for n in 01 02 03 04 05 06 07 08; do
            url="https://contour-cycling-hi6evz.v2.appdeploy.ai/contour-parts/part-${n}.txt"
            out="/tmp/contour-parts/part-${n}.txt"
            curl --fail --silent --show-error --location --retry 3 "$url" -o "$out"
            echo "part-${n}: $(wc -c < "$out") bytes; type=$(file -b --mime-type "$out"); first=$(head -c 24 "$out")"
            if ! grep -qE '^[A-Za-z0-9+/=[:space:]]+$' "$out"; then
              echo "part-${n} contains non-base64 characters"
              exit 20
            fi
            cat "$out" >> /tmp/contour.b64
          done
          tr -d '\r\n\t ' < /tmp/contour.b64 > /tmp/contour.clean.b64
          echo "combined chars: $(wc -c < /tmp/contour.clean.b64); modulo4=$(( $(wc -c < /tmp/contour.clean.b64) % 4 ))"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/contour.clean.b64')
          s=p.read_text()
          s += '='*((4-len(s)%4)%4)
          p.write_text(s)
          PY
          base64 --decode /tmp/contour.clean.b64 > /tmp/contour.gz
          gzip --decompress --stdout /tmp/contour.gz > Experiments/Cycling/Contour/index.html
          sha256sum Experiments/Cycling/Contour/index.html
          test "$(wc -c < Experiments/Cycling/Contour/index.html)" -eq 152731
          test "$(sha256sum Experiments/Cycling/Contour/index.html | cut -d' ' -f1)" = '891c5ac042ca01cb7d0838fe3de665b9c358cbe027f07c12c61acceb5455be39'

      - name: Commit standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Contour Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add Experiments/Cycling/Contour/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Contour cycling experiment [skip ci]'
          git push origin master
