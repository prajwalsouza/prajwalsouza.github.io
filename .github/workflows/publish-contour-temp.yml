name: Publish Contour temporary transfer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-contour-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Copy exact standalone Contour HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Experiments/Cycling/Contour
          : > /tmp/contour.b64
          for n in 01 02 03 04 05 06 07 08; do
            curl --fail --silent --show-error --location --retry 3 "https://contour-cycling-hi6evz.v2.appdeploy.ai/contour-parts/part-${n}.txt" >> /tmp/contour.b64
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, sys
          s=''.join(Path('/tmp/contour.b64').read_text().split())
          # Strip any transport padding between chunks, then pad the single stream once.
          s=s.replace('=','')
          s += '='*((4-len(s)%4)%4)
          try:
              packed=base64.b64decode(s, validate=False)
              html=gzip.decompress(packed)
          except Exception as e:
              print('decode failed:',repr(e))
              sys.exit(20)
          digest=hashlib.sha256(html).hexdigest()
          print('decoded bytes:',len(html),'sha256:',digest)
          expected='891c5ac042ca01cb7d0838fe3de665b9c358cbe027f07c12c61acceb5455be39'
          if len(html)!=152731 or digest!=expected:
              print('Transfer does not match canonical contour.html; refusing to publish.')
              sys.exit(21)
          Path('Experiments/Cycling/Contour/index.html').write_bytes(html)
          PY

      - name: Commit standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Contour Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add Experiments/Cycling/Contour/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Contour cycling experiment [skip ci]'
          git push origin master
