<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
      --accent: hsla(190, 88%, 56%, 1);
      --accent-strong: hsla(190, 88%, 46%, 1);
      --accent-soft: hsla(190, 88%, 92%, 0.55);
      --body-bg: linear-gradient(135deg, hsla(190, 82%, 97%, 1), hsla(210, 86%, 94%, 1));
      --panel-bg: hsla(0, 0%, 100%, 0.86);
      --canvas-bg: hsla(0, 0%, 100%, 1);
      --body-text: hsla(217, 28%, 15%, 1);
      --muted-text: hsla(219, 12%, 42%, 1);
      --chip-bg: hsla(190, 88%, 90%, 0.38);
      --focus-ring: hsla(190, 75%, 60%, 0.28);
      --shadow: 0 24px 60px -36px rgba(15, 23, 42, 0.55);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Nunito', 'Raleway', sans-serif;
      background: var(--body-bg);
      color: var(--body-text);
      min-height: 100vh;
    }

    main {
      max-width: 1180px;
    }

    header span.badge {
      background: var(--chip-bg);
      color: var(--accent);
      letter-spacing: 0.12em;
    }

    header .lead {
      color: var(--muted-text);
      max-width: 36rem;
      margin: 0 auto;
    }

    .qr-card,
    .qr-preview {
      background: var(--panel-bg);
      border: none;
      border-radius: 1.6rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .qr-card .card-body,
    .qr-preview .card-body {
      padding: clamp(1.75rem, 4vw, 2.8rem);
    }

    label.form-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted-text);
      margin-bottom: 0.35rem;
    }

    .form-control,
    .form-select {
      border-radius: 0.85rem;
      border: 1px solid transparent;
      background-color: hsla(0, 0%, 100%, 0.82);
      padding: 0.7rem 0.9rem;
      box-shadow: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: hsla(0, 0%, 100%, 0.01);
      box-shadow: 0 0 0 0.25rem var(--focus-ring);
    }

    textarea.form-control {
      min-height: 104px;
      resize: vertical;
    }

    .form-range {
      width: 100%;
      accent-color: var(--accent);
    }

    .form-range::-webkit-slider-thumb {
      background: var(--accent);
    }

    .form-range::-moz-range-thumb {
      background: var(--accent);
    }

    .form-control-color {
      border-radius: 0.75rem;
      padding: 0.2rem;
      width: 100%;
      height: 2.6rem;
    }

    .btn-accent {
      background: var(--accent);
      border: none;
      border-radius: 999px;
      color: #fff;
      font-weight: 600;
      padding: 0.65rem 1.7rem;
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .btn-accent:hover,
    .btn-accent:focus-visible {
      background: var(--accent-strong);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 12px 26px -16px var(--accent);
    }

    .btn-outline-accent {
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
      padding: 0.65rem 1.6rem;
      background: transparent;
      transition: background 160ms ease, transform 160ms ease;
    }

    .btn-outline-accent:hover,
    .btn-outline-accent:focus-visible {
      background: var(--accent-soft);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .info-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .qr-artboard {
      background: var(--canvas-bg);
      border-radius: 1.4rem;
      padding: clamp(1.2rem, 4vw, 2.3rem);
      display: grid;
      place-items: center;
      min-height: 220px;
    }

    .qr-artboard--secondary {
      background: transparent;
      border: 1px dashed var(--accent-soft);
    }

    .qr-canvas {
      width: min(100%, 360px);
      height: auto;
      image-rendering: pixelated;
    }

    #svgPreview {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 0.75rem;
    }

    #svgPreview svg {
      width: min(100%, 360px);
      height: auto;
    }

    footer.small {
      color: var(--muted-text);
    }

    @media (max-width: 991.98px) {
      header .display-5 {
        font-size: 2.4rem;
      }
      .qr-card,
      .qr-preview {
        border-radius: 1.25rem;
      }
    }

    @media (max-width: 575.98px) {
      main {
        padding-inline: 1rem;
      }
      .qr-card .card-body,
      .qr-preview .card-body {
        padding: 1.5rem;
      }
      .qr-artboard {
        padding: 1.1rem;
        border-radius: 1rem;
        min-height: 200px;
      }
      .btn-accent,
      .btn-outline-accent {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="container py-4 py-lg-5">
    <header class="text-center mb-4 mb-lg-5">
      <span class="badge rounded-pill px-3 py-2">Lab Utility</span>
      <h1 class="display-5 fw-semibold mt-3">QR Code Generator</h1>
      <p class="lead mt-2">Craft crisp QR art in seconds. Tune shapes, colors, and export both bitmap and vector files.</p>
    </header>

    <div class="row gy-4 gx-lg-5 align-items-stretch">
      <div class="col-12 col-lg-5">
        <div class="qr-card card h-100">
          <div class="card-body">
            <form id="qrForm" class="row g-3">
              <div class="col-12">
                <label for="text" class="form-label">Content</label>
                <textarea id="text" class="form-control form-control-lg" placeholder="Paste your link or text here">https://example.com</textarea>
              </div>

              <div class="col-sm-6">
                <label for="ecc" class="form-label">Error correction</label>
                <select id="ecc" class="form-select">
                  <option value="L">Low (L)</option>
                  <option value="M" selected>Medium (M)</option>
                  <option value="Q">Quartile (Q)</option>
                  <option value="H">High (H)</option>
                </select>
              </div>

              <div class="col-sm-6">
                <label for="size" class="form-label">Target size (px)</label>
                <input id="size" type="number" class="form-control" min="128" max="2048" step="16" value="360">
              </div>

              <div class="col-sm-6">
                <label for="quiet" class="form-label">Quiet zone (modules)</label>
                <input id="quiet" type="number" class="form-control" min="0" max="16" step="1" value="4">
              </div>

              <div class="col-sm-6">
                <label for="roundness" class="form-label d-flex justify-content-between align-items-center">
                  <span>Roundness</span>
                  <span id="roundnessValue" class="badge bg-transparent text-muted fw-semibold">0.20</span>
                </label>
                <input id="roundness" type="range" class="form-range" min="0" max="0.45" step="0.05" value="0.20">
              </div>

              <div class="col-sm-6">
                <label for="moduleStyle" class="form-label">Module style</label>
                <select id="moduleStyle" class="form-select">
                  <option value="square">Squares</option>
                  <option value="rounded" selected>Rounded</option>
                  <option value="circle">Circles</option>
                  <option value="diamond">Diamonds</option>
                </select>
              </div>

              <div class="col-sm-6">
                <label for="eyeStyle" class="form-label">Eye style</label>
                <select id="eyeStyle" class="form-select">
                  <option value="square">Classic Square</option>
                  <option value="rounded" selected>Rounded</option>
                  <option value="circle">Circle</option>
                  <option value="diamond">Diamond</option>
                </select>
              </div>

              <div class="col-sm-4">
                <label for="darkColor" class="form-label">Module color</label>
                <input id="darkColor" type="color" class="form-control form-control-color" value="#111111" title="Module color">
              </div>

              <div class="col-sm-4">
                <label for="eyeColor" class="form-label">Eye color</label>
                <input id="eyeColor" type="color" class="form-control form-control-color" value="#111111" title="Eye color">
              </div>

              <div class="col-sm-4">
                <label for="bgColor" class="form-label">Background</label>
                <input id="bgColor" type="color" class="form-control form-control-color" value="#ffffff" title="Background color">
              </div>

              <div class="col-12">
                <div class="d-flex flex-wrap gap-2">
                  <button id="renderBtn" type="submit" class="btn btn-accent">
                    <i class="fa-solid fa-wand-magic-sparkles me-2"></i>
                    Render
                  </button>
                  <button id="pngBtn" type="button" class="btn btn-outline-accent">
                    <i class="fa-solid fa-image me-2"></i>
                    PNG
                  </button>
                  <button id="svgBtn" type="button" class="btn btn-outline-accent">
                    <i class="fa-solid fa-vector-square me-2"></i>
                    SVG
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-7">
        <div class="qr-preview card h-100">
          <div class="card-body d-grid gap-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <div>
                <h2 class="h4 fw-semibold mb-1">Live preview</h2>
                <p class="text-muted small mb-0">Canvas rendering and SVG export stay in sync.</p>
              </div>
              <span class="info-chip">
                <i class="fa-solid fa-palette"></i>
                HSLA Mode
              </span>
            </div>

            <div class="qr-artboard">
              <canvas id="canvas" class="qr-canvas" aria-label="QR code canvas preview"></canvas>
            </div>

            <div>
              <h3 class="h6 text-uppercase text-muted fw-semibold mb-3">Vector preview</h3>
              <div class="qr-artboard qr-artboard--secondary" aria-live="polite">
                <div id="svgPreview" data-svg="">
                  <p class="text-muted small mb-0 text-center px-3">SVG preview appears after rendering.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    (function () {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const root = document.documentElement;
      const form = $('qrForm');
      const roundnessInput = $('roundness');
      const roundnessIndicator = $('roundnessValue');
      const autoRender = debounce(renderAll, 160);
      const hues = [190, 40, 280, 320];

      initPalette();
      updateRoundnessDisplay(roundnessInput.value);
      renderAll();

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        renderAll();
      });

      form.addEventListener('input', function (event) {
        if (event.target === roundnessInput) {
          updateRoundnessDisplay(roundnessInput.value);
        }
        if (event.target.matches('select, input[type="color"]')) {
          renderAll();
        } else {
          autoRender();
        }
      });

      $('renderBtn').addEventListener('click', function (event) {
        event.preventDefault();
        renderAll();
      });

      $('pngBtn').addEventListener('click', function () {
        const canvas = $('canvas');
        if (!canvas.width) return;
        const link = document.createElement('a');
        link.download = 'qr-code.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      $('svgBtn').addEventListener('click', function () {
        const svg = $('svgPreview').dataset.svg;
        if (!svg) return;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'qr-code.svg';
        link.href = url;
        link.click();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1200);
      });

      function initPalette() {
        const hue = hues[Math.floor(Math.random() * hues.length)];
        const accent = 'hsla(' + hue + ', 88%, 56%, 1)';
        const accentStrong = 'hsla(' + hue + ', 88%, 46%, 1)';
        const accentSoft = 'hsla(' + hue + ', 88%, 92%, 0.55)';
        const bodyBg = 'linear-gradient(140deg, hsla(' + hue + ', 84%, 97%, 1) 0%, hsla(' + hue + ', 88%, 92%, 1) 100%)';
        const panelBg = 'hsla(' + hue + ', 90%, 99%, 0.9)';
        const canvasBg = 'hsla(' + hue + ', 100%, 100%, 1)';
        const chipBg = 'hsla(' + hue + ', 88%, 90%, 0.38)';
        const focusRing = 'hsla(' + hue + ', 82%, 60%, 0.32)';

        root.style.setProperty('--accent', accent);
        root.style.setProperty('--accent-strong', accentStrong);
        root.style.setProperty('--accent-soft', accentSoft);
        root.style.setProperty('--body-bg', bodyBg);
        root.style.setProperty('--panel-bg', panelBg);
        root.style.setProperty('--canvas-bg', canvasBg);
        root.style.setProperty('--chip-bg', chipBg);
        root.style.setProperty('--focus-ring', focusRing);

        $('darkColor').value = hslToHex(hue, 82, 20);
        $('eyeColor').value = hslToHex(hue, 86, 46);
        $('bgColor').value = hslToHex(hue, 42, 96);
      }

      function updateRoundnessDisplay(value) {
        roundnessIndicator.textContent = Number(value).toFixed(2);
      }

      function gatherOptions() {
        return {
          text: $('text').value.trim() || ' ',
          ecc: $('ecc').value,
          size: clampNumber(parseInt($('size').value, 10) || 360, 96, 2048),
          quiet: clampNumber(parseInt($('quiet').value, 10) || 4, 0, 16),
          roundness: clampNumber(parseFloat(roundnessInput.value) || 0, 0, 0.5),
          moduleStyle: $('moduleStyle').value,
          eyeStyle: $('eyeStyle').value,
          darkColor: $('darkColor').value,
          eyeColor: $('eyeColor').value,
          bgColor: $('bgColor').value
        };
      }

      function renderAll() {
        const opts = gatherOptions();
        const matrix = buildMatrix(opts.text, opts.ecc);
        renderCanvas(matrix, opts);
        const svg = renderSVG(matrix, opts).svg;
        const svgPreview = $('svgPreview');
        svgPreview.innerHTML = svg;
        svgPreview.dataset.svg = svg;
      }

      function buildMatrix(text, ecc) {
        const level = ({ L: 'L', M: 'M', Q: 'Q', H: 'H' })[ecc] || 'M';
        const qr = qrcode(0, level);
        qr.addData(text || ' ');
        qr.make();
        const n = qr.getModuleCount();
        const matrix = [];
        for (let r = 0; r < n; r++) {
          const row = [];
          for (let c = 0; c < n; c++) {
            row.push(qr.isDark(r, c));
          }
          matrix.push(row);
        }
        return matrix;
      }

      function renderCanvas(matrix, opts) {
        const n = matrix.length;
        const modulesWithQuiet = n + 2 * opts.quiet;
        const moduleSize = Math.max(1, Math.floor(opts.size / modulesWithQuiet));
        const finalSize = moduleSize * modulesWithQuiet;
        const canvas = $('canvas');
        canvas.width = finalSize;
        canvas.height = finalSize;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = opts.bgColor;
        ctx.fillRect(0, 0, finalSize, finalSize);

        ctx.fillStyle = opts.darkColor;
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if (!matrix[r][c] || isFinder(r, c, n)) continue;
            const x = (c + opts.quiet) * moduleSize;
            const y = (r + opts.quiet) * moduleSize;
            drawModuleCanvas(ctx, x, y, moduleSize, opts.moduleStyle, opts.roundness);
          }
        }

        const finderPositions = [
          { r: 0, c: 0 },
          { r: 0, c: n - 7 },
          { r: n - 7, c: 0 }
        ];

        finderPositions.forEach(function (pos) {
          drawFinderCanvas(ctx, pos.r, pos.c, moduleSize, opts);
        });

        return { canvas: canvas, finalSize: finalSize };
      }

      function drawModuleCanvas(ctx, x, y, size, style, roundness) {
        switch (style) {
          case 'circle':
            ctx.beginPath();
            ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
            break;
          case 'diamond':
            ctx.beginPath();
            ctx.moveTo(x + size / 2, y);
            ctx.lineTo(x + size, y + size / 2);
            ctx.lineTo(x + size / 2, y + size);
            ctx.lineTo(x, y + size / 2);
            ctx.closePath();
            ctx.fill();
            break;
          case 'rounded':
            ctx.beginPath();
            roundedRectPath(ctx, x, y, size, size, Math.min(roundness * size, size / 2));
            ctx.fill();
            break;
          default:
            ctx.fillRect(x, y, size, size);
            break;
        }
      }

      function drawFinderCanvas(ctx, row, col, moduleSize, opts) {
        const x = (col + opts.quiet) * moduleSize;
        const y = (row + opts.quiet) * moduleSize;
        const size = 7 * moduleSize;
        const middleSize = size - 2 * moduleSize;
        const innerSize = size - 4 * moduleSize;

        ctx.fillStyle = opts.eyeColor;
        ctx.beginPath();
        finderShapePath(ctx, x, y, size, opts.eyeStyle, opts.roundness);
        ctx.fill();

        ctx.fillStyle = opts.bgColor;
        ctx.beginPath();
        finderShapePath(ctx, x + moduleSize, y + moduleSize, middleSize, opts.eyeStyle, opts.roundness);
        ctx.fill();

        ctx.fillStyle = opts.darkColor;
        ctx.beginPath();
        finderShapePath(ctx, x + 2 * moduleSize, y + 2 * moduleSize, innerSize, opts.eyeStyle, opts.roundness);
        ctx.fill();
      }

      function finderShapePath(ctx, x, y, size, style, roundness) {
        const radius = Math.min(roundness * size, size / 2);
        if (style === 'circle') {
          ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
          ctx.closePath();
          return;
        }
        if (style === 'diamond') {
          ctx.moveTo(x + size / 2, y);
          ctx.lineTo(x + size, y + size / 2);
          ctx.lineTo(x + size / 2, y + size);
          ctx.lineTo(x, y + size / 2);
          ctx.closePath();
          return;
        }
        if (style === 'rounded') {
          roundedRectPath(ctx, x, y, size, size, radius);
          return;
        }
        ctx.rect(x, y, size, size);
        ctx.closePath();
      }

      function roundedRectPath(ctx, x, y, width, height, radius) {
        const r = Math.max(0, Math.min(radius, Math.min(width, height) / 2));
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function isFinder(r, c, n) {
        const inTop = r < 7;
        const inBottom = r >= n - 7;
        const inLeft = c < 7;
        const inRight = c >= n - 7;
        return (inTop && inLeft) || (inTop && inRight) || (inBottom && inLeft);
      }

      function renderSVG(matrix, opts) {
        const n = matrix.length;
        const modulesWithQuiet = n + 2 * opts.quiet;
        const moduleSize = Math.max(1, Math.floor(opts.size / modulesWithQuiet));
        const finalSize = moduleSize * modulesWithQuiet;
        const parts = [];
        const finderParts = [];

        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if (!matrix[r][c] || isFinder(r, c, n)) continue;
            const x = (c + opts.quiet) * moduleSize;
            const y = (r + opts.quiet) * moduleSize;
            parts.push(svgModuleShape(x, y, moduleSize, opts.moduleStyle, opts.roundness, opts.darkColor));
          }
        }

        const finderPositions = [
          { r: 0, c: 0 },
          { r: 0, c: n - 7 },
          { r: n - 7, c: 0 }
        ];

        finderPositions.forEach(function (pos) {
          const x = (pos.c + opts.quiet) * moduleSize;
          const y = (pos.r + opts.quiet) * moduleSize;
          finderParts.push.apply(finderParts, svgFinderLayers(x, y, moduleSize, opts));
        });

        const svg = [
          '<svg xmlns="http://www.w3.org/2000/svg" width="' + finalSize + '" height="' + finalSize + '" viewBox="0 0 ' + finalSize + ' ' + finalSize + '">',
          '<rect width="100%" height="100%" fill="' + opts.bgColor + '"/>',
          finderParts.join(''),
          parts.join(''),
          '</svg>'
        ].join('');

        return { svg: svg, finalSize: finalSize };
      }

      function svgModuleShape(x, y, size, style, roundness, color) {
        if (style === 'circle') {
          const cx = x + size / 2;
          const cy = y + size / 2;
          return '<circle cx="' + cx + '" cy="' + cy + '" r="' + size / 2 + '" fill="' + color + '"/>';
        }
        if (style === 'diamond') {
          const cx = x + size / 2;
          const cy = y + size / 2;
          return '<path d="M ' + cx + ' ' + y + ' L ' + (x + size) + ' ' + cy + ' L ' + cx + ' ' + (y + size) + ' L ' + x + ' ' + cy + ' Z" fill="' + color + '"/>';
        }
        if (style === 'rounded') {
          const radius = Math.min(roundness * size, size / 2);
          return '<rect x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" rx="' + radius + '" ry="' + radius + '" fill="' + color + '"/>';
        }
        return '<rect x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" fill="' + color + '"/>';
      }

      function svgFinderLayers(x, y, moduleSize, opts) {
        const size = 7 * moduleSize;
        const middle = size - 2 * moduleSize;
        const inner = size - 4 * moduleSize;
        return [
          svgFinderLayer(x, y, size, opts.eyeStyle, opts.roundness, opts.eyeColor),
          svgFinderLayer(x + moduleSize, y + moduleSize, middle, opts.eyeStyle, opts.roundness, opts.bgColor),
          svgFinderLayer(x + 2 * moduleSize, y + 2 * moduleSize, inner, opts.eyeStyle, opts.roundness, opts.darkColor)
        ];
      }

      function svgFinderLayer(x, y, size, style, roundness, color) {
        if (style === 'circle') {
          const r = size / 2;
          return '<circle cx="' + (x + r) + '" cy="' + (y + r) + '" r="' + r + '" fill="' + color + '"/>';
        }
        if (style === 'diamond') {
          const cx = x + size / 2;
          const cy = y + size / 2;
          return '<path d="M ' + cx + ' ' + y + ' L ' + (x + size) + ' ' + cy + ' L ' + cx + ' ' + (y + size) + ' L ' + x + ' ' + cy + ' Z" fill="' + color + '"/>';
        }
        if (style === 'rounded') {
          const radius = Math.min(roundness * size, size / 2);
          return '<rect x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" rx="' + radius + '" ry="' + radius + '" fill="' + color + '"/>';
        }
        return '<rect x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" fill="' + color + '"/>';
      }

      function clampNumber(value, min, max) {
        if (value < min) return min;
        if (value > max) return max;
        return value;
      }

      function debounce(fn, wait) {
        let timeout;
        return function () {
          const context = this;
          const args = arguments;
          clearTimeout(timeout);
          timeout = setTimeout(function () {
            fn.apply(context, args);
          }, wait);
        };
      }

      function hslToHex(h, s, l) {
        s /= 100;
        l /= 100;
        const k = function (n) { return (n + h / 30) % 12; };
        const a = s * Math.min(l, 1 - l);
        const f = function (n) {
          return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        };
        const toHex = function (x) {
          return Math.round(x * 255).toString(16).padStart(2, '0');
        };
        return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
      }
    })();
  </script>
