    <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const createInitialDragState = () => ({
      active: false,
      pageIndex: null,
      startX: 0,
      startY: 0,
      currentX: 0,
      currentY: 0
    });

    function App() {
      const [theme, setTheme] = useState('light');
      const [accentHue, setAccentHue] = useState(212);
      const [dragOver, setDragOver] = useState(false);
      const [fileName, setFileName] = useState(null);
      const [numPages, setNumPages] = useState(0);
      const [pagesMeta, setPagesMeta] = useState([]);
      const [loadingPdf, setLoadingPdf] = useState(false);
      const [dragState, setDragState] = useState(createInitialDragState);
      const [history, setHistory] = useState([]);
      const [toast, setToast] = useState(null);
      const [exporting, setExporting] = useState(false);

      const fileInputRef = useRef(null);
      const canvasRefs = useRef([]);
      const pdfRef = useRef(null);
      const pdfDataRef = useRef(null);

      useEffect(() => {
        document.documentElement.style.setProperty('--accent-h', accentHue);
      }, [accentHue]);

      useEffect(() => {
        if (!toast) return;
        const id = setTimeout(() => setToast(null), 2800);
        return () => clearTimeout(id);
      }, [toast]);

      useEffect(() => {
        const pdfjsLib = window['pdfjsLib'];
        if (!pdfjsLib || !pdfRef.current || !numPages) {
          return;
        }
        (async () => {
          for (let i = 1; i <= numPages; i++) {
            const canvas = canvasRefs.current[i - 1];
            if (!canvas) continue;
            try {
              const page = await pdfRef.current.getPage(i);
              const viewport = page.getViewport({ scale: 1 });
              const ctx = canvas.getContext('2d');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              await page.render({ canvasContext: ctx, viewport }).promise;
            } catch (err) {
              console.error('Failed to render page', i, err);
            }
          }
        })();
      }, [numPages]);

      const showToast = (message) => {
        if (!message) return;
        setToast(message);
      };

      const handleThemeToggle = () => {
        setTheme((prev) => (prev === 'light' ? 'dark' : 'light'));
      };

      const handleBrowseClick = () => {
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleDragOver = (event) => {
        event.preventDefault();
        setDragOver(true);
      };

      const handleDragLeave = (event) => {
        event.preventDefault();
        setDragOver(false);
      };

      const loadPdf = async (arrayBuffer) => {
        const pdfjsLib = window['pdfjsLib'];
        if (!pdfjsLib) {
          showToast('pdf.js is unavailable in this browser.');
          setLoadingPdf(false);
          return;
        }
        try {
          const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
          const pdf = await loadingTask.promise;
          pdfRef.current = pdf;
          setNumPages(pdf.numPages);
          setPagesMeta(
            Array.from({ length: pdf.numPages }, (_, index) => ({
              index,
              deleted: false,
              redactions: []
            }))
          );
          canvasRefs.current = new Array(pdf.numPages);
          setHistory([]);
          setDragState(createInitialDragState());
          showToast('PDF ready. Draw boxes to remove text.');
        } catch (err) {
          console.error(err);
          showToast('Could not load PDF. Check console.');
        } finally {
          setLoadingPdf(false);
        }
      };

      const handleFiles = (files) => {
        const file = files && files[0];
        if (!file) return;
        if (
          file.type !== 'application/pdf' &&
          !file.name.toLowerCase().endsWith('.pdf')
        ) {
          showToast('Please provide a PDF file.');
          return;
        }
        setFileName(file.name);
        setLoadingPdf(true);
        const reader = new FileReader();
        reader.onload = async (event) => {
          const buffer = event.target.result;
          pdfDataRef.current = buffer;
          await loadPdf(buffer);
        };
        reader.onerror = () => {
          showToast('Could not read that file.');
          setLoadingPdf(false);
        };
        reader.readAsArrayBuffer(file);
      };

      const handleDrop = (event) => {
        event.preventDefault();
        setDragOver(false);
        const transfer = event.dataTransfer;
        const files = transfer && transfer.files;
        if (files && files.length) {
          handleFiles(files);
        }
        if (transfer) {
          transfer.clearData();
        }
      };

      const handleFileInputChange = (event) => {
        const { files } = event.target;
        if (files && files.length) {
          handleFiles(files);
        }
        event.target.value = '';
      };

      const getRelativePoint = (event) => {
        const rect = event.currentTarget.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      };

      const handleMouseDown = (pageIndex, event) => {
        const targetMeta = pagesMeta[pageIndex];
        if (!targetMeta || targetMeta.deleted) return;
        const point = getRelativePoint(event);
        setDragState({
          active: true,
          pageIndex,
          startX: point.x,
          startY: point.y,
          currentX: point.x,
          currentY: point.y
        });
      };

      const handleMouseMove = (pageIndex, event) => {
        if (!dragState.active || dragState.pageIndex !== pageIndex) return;
        const point = getRelativePoint(event);
        setDragState((prev) => ({
          ...prev,
          currentX: point.x,
          currentY: point.y
        }));
      };

      const finalizeSelection = (state) => {
        if (!state.active || state.pageIndex === null) {
          setDragState(createInitialDragState());
          return;
        }
        const width = Math.abs(state.currentX - state.startX);
        const height = Math.abs(state.currentY - state.startY);
        setDragState(createInitialDragState());
        if (width < 5 || height < 5) {
          return;
        }
        const box = {
          x: Math.min(state.startX, state.currentX),
          y: Math.min(state.startY, state.currentY),
          width,
          height
        };
        setPagesMeta((prev) =>
          prev.map((meta) =>
            meta.index === state.pageIndex
              ? { ...meta, redactions: [...meta.redactions, box] }
              : meta
          )
        );
        setHistory((prev) => [
          ...prev,
          { type: 'add-redaction', pageIndex: state.pageIndex }
        ]);
      };

      const handleMouseUp = (pageIndex, event) => {
        if (!dragState.active || dragState.pageIndex !== pageIndex) return;
        const point = getRelativePoint(event);
        finalizeSelection({ ...dragState, currentX: point.x, currentY: point.y });
      };

      const handleMouseLeave = (pageIndex) => {
        if (!dragState.active || dragState.pageIndex !== pageIndex) return;
        finalizeSelection(dragState);
      };

      const handlePageDeleteToggle = (pageIndex) => {
        setPagesMeta((prev) =>
          prev.map((meta) =>
            meta.index === pageIndex
              ? { ...meta, deleted: !meta.deleted }
              : meta
          )
        );
        setHistory((prev) => [...prev, { type: 'toggle-page', pageIndex }]);
      };

      const handleUndo = () => {
        setHistory((prevHist) => {
          if (!prevHist.length) {
            showToast('Nothing to undo.');
            return prevHist;
          }
          const updated = [...prevHist];
          const last = updated.pop();
          if (last.type === 'add-redaction') {
            setPagesMeta((prevMeta) =>
              prevMeta.map((meta) => {
                if (meta.index !== last.pageIndex || !meta.redactions.length) {
                  return meta;
                }
                return {
                  ...meta,
                  redactions: meta.redactions.slice(0, -1)
                };
              })
            );
          } else if (last.type === 'toggle-page') {
            setPagesMeta((prevMeta) =>
              prevMeta.map((meta) =>
                meta.index === last.pageIndex
                  ? { ...meta, deleted: !meta.deleted }
                  : meta
              )
            );
          }
          return updated;
        });
      };

      const handleExport = async () => {
        if (!pdfDataRef.current || !pdfRef.current || !numPages) {
          showToast('Load a PDF first.');
          return;
        }
        setExporting(true);
        try {
          const { PDFDocument, rgb } = PDFLib;
          const existingPdfBytes = new Uint8Array(pdfDataRef.current);
          const srcDoc = await PDFDocument.load(existingPdfBytes);
          const newDoc = await PDFDocument.create();

          for (let i = 0; i < numPages; i++) {
            const meta = pagesMeta[i];
            if (!meta || meta.deleted) continue;
            const [copiedPage] = await newDoc.copyPages(srcDoc, [i]);
            newDoc.addPage(copiedPage);
            const { width, height } = copiedPage.getSize();
            meta.redactions.forEach((box) => {
              const y = height - (box.y + box.height);
              copiedPage.drawRectangle({
                x: box.x,
                y,
                width: box.width,
                height: box.height,
                color: rgb(1, 1, 1)
              });
            });
          }

          const pdfBytes = await newDoc.save();
          const blob = new Blob([pdfBytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const baseName = fileName || 'document';
          const downloadName = baseName.replace(/\.pdf$/i, '') + '-cleaned.pdf';
          a.href = url;
          a.download = downloadName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Exported edited PDF.');
        } catch (err) {
          console.error(err);
          showToast('Failed to export PDF.');
        } finally {
          setExporting(false);
        }
      };

      const totalRedactions = pagesMeta.reduce(
        (acc, meta) => acc + meta.redactions.length,
        0
      );
      const deletedPages = pagesMeta.filter((meta) => meta.deleted).length;

      const dragBox = dragState.active
        ? {
            x: Math.min(dragState.startX, dragState.currentX),
            y: Math.min(dragState.startY, dragState.currentY),
            width: Math.abs(dragState.currentX - dragState.startX),
            height: Math.abs(dragState.currentY - dragState.startY)
          }
        : null;

      return (
        <div className={'app ' + theme}>
          <div className="page-container container py-4 py-lg-5">
            <header className="card hero-card border-0 mb-4">
              <div className="card-body p-4 p-xl-5">
                <div className="row g-4 align-items-center">
                  <div className="col-lg-7">
                    <p className="eyebrow">Browser-side PDF cleanup</p>
                    <h1 className="hero-title">PDF Text Remover Lab</h1>
                    <p className="hero-copy">
                      Redact typography, stamps, signatures, or entire sheets by drawing boxes,
                      then export a refreshed PDF without ever sending data to a server.
                    </p>
                    <div className="hero-actions">
                      <div className="btn-cluster">
                        <button
                          className="command-btn ghost"
                          onClick={handleUndo}
                          title="Undo last action"
                        >
                          <i className="fa-solid fa-rotate-left" />
                          <span>Undo</span>
                        </button>
                        <button
                          className="command-btn primary"
                          onClick={handleExport}
                          disabled={!numPages || exporting}
                        >
                          <i className="fa-regular fa-file-pdf" />
                          <span>{exporting ? 'Exporting...' : 'Export PDF'}</span>
                        </button>
                      </div>
                      <div className="d-flex flex-wrap align-items-center gap-3">
                        <div className="theme-dial">
                          <label htmlFor="accentHue">Accent hue ({accentHue} deg)</label>
                          <input
                            id="accentHue"
                            type="range"
                            min="0"
                            max="360"
                            value={accentHue}
                            onChange={(e) =>
                              setAccentHue(parseInt(e.target.value, 10))
                            }
                          />
                        </div>
                        <button
                          className="command-btn icon-only"
                          onClick={handleThemeToggle}
                          title="Toggle light or dark"
                        >
                          <i
                            className={
                              theme === 'light'
                                ? 'fa-solid fa-moon'
                                : 'fa-solid fa-sun'
                            }
                          />
                        </button>
                      </div>
                    </div>
                  </div>
                  <div className="col-lg-5">
                    <div className="stat-grid">
                      <div className="stat-chip">
                        <span className="label">Pages loaded</span>
                        <span className="value">{numPages ? numPages : '--'}</span>
                        <span className="hint">
                          {fileName ? 'Source: ' + fileName : 'Waiting for a PDF'}
                        </span>
                      </div>
                      <div className="stat-chip">
                        <span className="label">Redactions placed</span>
                        <span className="value">{totalRedactions}</span>
                        <span className="hint">
                          {deletedPages} page{deletedPages !== 1 ? 's' : ''} hidden
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </header>

            <div className="row g-4">
              <div className="col-lg-4">
                <section className="card glassy-card h-100">
                  <div className="card-body">
                    <div className="d-flex flex-wrap justify-content-between gap-3">
                      <div>
                        <div className="card-title">
                          <i className="fa-solid fa-upload" />
                          Source PDF
                        </div>
                        <div className="card-subtitle">
                          Drop a file into the lab or browse for it manually.
                        </div>
                      </div>
                      <button className="command-btn ghost" onClick={handleBrowseClick}>
                        <i className="fa-regular fa-folder-open" />
                        <span>Browse</span>
                      </button>
                    </div>

                    <div
                      className={'drop-zone ' + (dragOver ? 'drag-active' : '')}
                      onClick={handleBrowseClick}
                      onDrop={handleDrop}
                      onDragOver={handleDragOver}
                      onDragLeave={handleDragLeave}
                    >
                      <div className="drop-icon">
                        <i className="fa-regular fa-file-pdf" />
                      </div>
                      <div className="drop-main-text">Drop a PDF to start cleaning</div>
                      <div className="drop-sub-text">
                        Runs entirely inside your browser. Files never leave this tab.
                      </div>
                      <div className="drop-cta">
                        <i className="fa-solid fa-arrow-turn-up fa-rotate-90" />
                        <span>Prefer clicking? Pick a file instead</span>
                      </div>
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="application/pdf"
                        className="hidden-input"
                        onChange={handleFileInputChange}
                      />
                    </div>

                    <div className="mt-3">
                      <ul className="hint-list">
                        <li>Draw a box to white out any visible text or artwork.</li>
                        <li>Use the page toolbar to hide entire sheets from export.</li>
                        <li>Undo reverses both redactions and deleted pages.</li>
                      </ul>
                    </div>

                    <div className="file-meta mt-3">
                      <div className="file-name">
                        <i className="fa-regular fa-circle-dot" />
                        <span>
                          {fileName
                            ? fileName
                            : loadingPdf
                            ? 'Loading PDF...'
                            : 'No file selected yet.'}
                        </span>
                      </div>
                      <div className="file-badges">
                        {numPages ? (
                          <>
                            <span className="file-badge">
                              {numPages} page{numPages !== 1 ? 's' : ''}
                            </span>
                            <span className="file-badge-soft">
                              {deletedPages} hidden, {totalRedactions} boxes
                            </span>
                          </>
                        ) : (
                          <span className="file-badge-soft">Ready when you are.</span>
                        )}
                      </div>
                    </div>
                  </div>
                </section>
              </div>

              <div className="col-lg-8">
                <section className="card glassy-card editor-panel">
                  <div className="card-body">
                    <div className="editor-toolbar">
                      <div className="d-flex flex-wrap gap-2">
                        <span className="pill pill-strong">
                          <i className="fa-regular fa-hand-pointer" />
                          Drag to draw redaction boxes
                        </span>
                        <span className="pill pill-danger">
                          <i className="fa-regular fa-rectangle-xmark" />
                          Hide whole pages from their toolbar
                        </span>
                        <span className="pill pill-soft">
                          <i className="fa-solid fa-shuffle" />
                          Undo mistakes from the hero bar
                        </span>
                      </div>
                      <span className="pill pill-soft">
                        <i className="fa-regular fa-circle-dot" />
                        {theme === 'light' ? 'Light mode' : 'Dark mode'}
                      </span>
                    </div>

                    <div className="editor-surface">
                      {numPages === 0 ? (
                        <div className="empty-state">
                          <i className="fa-regular fa-eye-slash" />
                          <span>Load a PDF to start removing the bits you regret.</span>
                        </div>
                      ) : (
                        <div className="pages-column">
                          {pagesMeta.map((pageMeta, i) => (
                            <div key={i} className="page-wrapper">
                              <div className="page-toolbar">
                                <div className="page-index-pill">
                                  <i className="fa-regular fa-file-lines" />
                                  <span>Page {i + 1}</span>
                                </div>
                                <div className="d-flex gap-2 flex-wrap">
                                  <div
                                    className={
                                      'page-status ' +
                                      (pageMeta.deleted ? 'deleted' : 'active')
                                    }
                                  >
                                    <i
                                      className={
                                        pageMeta.deleted
                                          ? 'fa-solid fa-ban'
                                          : 'fa-solid fa-circle-check'
                                      }
                                    />
                                    <span>
                                      {pageMeta.deleted ? 'Hidden' : 'Included'}
                                    </span>
                                  </div>
                                  <button
                                    className={
                                      'command-btn ghost' +
                                      (pageMeta.deleted ? ' text-danger' : '')
                                    }
                                    onClick={() =>
                                      handlePageDeleteToggle(pageMeta.index)
                                    }
                                  >
                                    <i className="fa-regular fa-trash-can" />
                                    <span>
                                      {pageMeta.deleted
                                        ? 'Restore page'
                                        : 'Delete page'}
                                    </span>
                                  </button>
                                </div>
                              </div>
                              {!pageMeta.deleted && (
                                <div
                                  className="page-canvas-shell"
                                  onMouseDown={(e) =>
                                    handleMouseDown(pageMeta.index, e)
                                  }
                                  onMouseMove={(e) =>
                                    handleMouseMove(pageMeta.index, e)
                                  }
                                  onMouseUp={(e) =>
                                    handleMouseUp(pageMeta.index, e)
                                  }
                                  onMouseLeave={() =>
                                    handleMouseLeave(pageMeta.index)
                                  }
                                >
                                  <canvas
                                    className="pdf-page"
                                    ref={(el) => (canvasRefs.current[i] = el)}
                                  />
                                  {pageMeta.redactions.map((r, idx) => (
                                    <div
                                      key={idx}
                                      className="redaction-box"
                                      style={{
                                        left: r.x + 'px',
                                        top: r.y + 'px',
                                        width: r.width + 'px',
                                        height: r.height + 'px'
                                      }}
                                    />
                                  ))}
                                  {dragBox &&
                                    dragState.pageIndex === pageMeta.index && (
                                      <div
                                        className="redaction-box draft"
                                        style={{
                                          left: dragBox.x + 'px',
                                          top: dragBox.y + 'px',
                                          width: dragBox.width + 'px',
                                          height: dragBox.height + 'px'
                                        }}
                                      />
                                    )}
                                </div>
                              )}
                              {pageMeta.deleted && (
                                <div className="text-muted small mt-1">
                                  This page will be removed from the exported PDF.
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="status-footer">
                      <span>
                        <i className="fa-regular fa-circle-question" />
                        {numPages
                          ? 'Draw boxes to hide elements. Export to bake them into a new PDF.'
                          : 'Waiting for a PDF. Nothing leaves your browser.'}
                      </span>
                      <span>
                        <strong>{totalRedactions}</strong> box
                        {totalRedactions !== 1 ? 'es' : ''},{' '}
                        <strong>{deletedPages}</strong> page
                        {deletedPages !== 1 ? 's' : ''} removed
                      </span>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>

          {toast && (
            <div className="toast">
              <i className="fa-solid fa-circle-exclamation" />
              <div>{toast}</div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
